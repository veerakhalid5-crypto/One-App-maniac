<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0e11">
<title>Market Engine</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0e11;--panel:#0d1117;--panel2:#131722;--line:#1e2329;
  --text:#eaecef;--muted:#9aa4b2;--dim:#5e6673;
  --up:#26a69a;--down:#ef5350;--gold:#f0b90b;--blue:#2962ff;--purple:#b26bff;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:13px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#2a2e39;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1600px;margin:0 auto}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;flex-shrink:0}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hsym{font-size:15px;font-weight:700;letter-spacing:.3px}
.hmeta{font-size:11px;color:var(--muted);margin-top:1px}
.hprice{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hchg{font-size:11px;font-weight:600;text-align:right;margin-top:1px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
#tfbar{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#tfbar::-webkit-scrollbar{display:none}
.tf{padding:5px 10px;font-size:11px;font-weight:600;font-family:inherit;
  background:var(--panel2);color:var(--muted);border:1px solid transparent;
  border-radius:5px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s}
.tf:hover{color:var(--text)}
.tf.on{background:var(--gold);color:#0b0e11}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 420px}
#chartWrap{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
#chart{position:absolute;inset:0}
#chartOverlay{position:absolute;top:8px;left:8px;z-index:5;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(13,17,23,.92);border:1px solid var(--line);color:var(--text);
  padding:4px 9px;font-size:10px;font-weight:700;border-radius:4px;letter-spacing:.4px}
.chip.bull{color:var(--up);border-color:rgba(38,166,154,.4)}
.chip.bear{color:var(--down);border-color:rgba(239,83,80,.4)}
.chip.warn{color:var(--gold);border-color:rgba(240,185,11,.4)}
#chartStatus{position:absolute;left:10px;bottom:8px;z-index:5;font-size:10px;color:var(--dim);
  background:rgba(11,14,17,.85);padding:3px 8px;border-radius:4px;border:1px solid var(--line);pointer-events:none}
#chartStatus.live{color:var(--up)}
#chartStatus.err{color:var(--down)}
#right{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
#tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);flex-shrink:0;scrollbar-width:none;background:var(--panel)}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 13px;font-size:10px;font-weight:700;letter-spacing:.5px;
  background:none;color:var(--muted);border:none;border-bottom:2px solid transparent;
  cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);background:var(--panel2)}
#panels{flex:1;min-height:0;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;padding:12px;display:none;-webkit-overflow-scrolling:touch}
.panel.on{display:block}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card h4{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1px;
  text-transform:uppercase;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid #1a1f2b;font-size:11.5px;line-height:1.5}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);flex-shrink:0}
.kv .v{color:var(--text);font-weight:600;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.kv .v.pos{color:var(--up)}.kv .v.neg{color:var(--down)}.kv .v.warn{color:var(--gold)}
.sig{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;margin-bottom:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  cursor:pointer;transition:.15s}
.sig:hover{border-color:var(--gold);background:#161b23}
.sig.bull{border-left:3px solid var(--up)}
.sig.bear{border-left:3px solid var(--down)}
.sig.neut{border-left:3px solid var(--gold)}
.sig .ico{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.sig.bull .ico{background:var(--up)}
.sig.bear .ico{background:var(--down)}
.sig.neut .ico{background:var(--gold)}
.sig .body{flex:1;min-width:0}
.sig .head{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px;align-items:baseline}
.sig .title{font-weight:700;font-size:12px}
.sig .time{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.sig .reason{font-size:11px;color:var(--muted);line-height:1.5}
.sig .tfTag{display:inline-block;font-size:9px;font-weight:800;color:var(--gold);
  background:rgba(240,185,11,.12);padding:1px 5px;border-radius:3px;margin-right:5px}
.verdict{padding:12px;border-radius:8px;font-weight:700;font-size:15px;
  text-align:center;letter-spacing:.5px;margin-bottom:10px}
.verdict.bull{background:rgba(38,166,154,.12);color:var(--up);border:1px solid rgba(38,166,154,.4)}
.verdict.bear{background:rgba(239,83,80,.12);color:var(--down);border:1px solid rgba(239,83,80,.4)}
.verdict.neut{background:rgba(240,185,11,.10);color:var(--gold);border:1px solid rgba(240,185,11,.35)}
.verdict small{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:5px;letter-spacing:0}
.ev{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #1a1f2b;font-size:11.5px}
.ev:last-child{border-bottom:none}
.ev .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ev .dot.g{background:var(--up)}.ev .dot.r{background:var(--down)}
.ev .dot.y{background:var(--gold)}.ev .dot.b{background:var(--blue)}
.ev .b{flex:1}
.ev b{color:var(--text);font-weight:600}
.ev span{color:var(--muted);display:block;margin-top:1px;line-height:1.5}
.liqItem{padding:9px 10px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;cursor:pointer;transition:.15s}
.liqItem:hover{border-color:var(--gold);background:#161b23}
.liqItem.hot{border-color:var(--gold);background:rgba(240,185,11,.06)}
.liqTop{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.liqName{font-weight:700;font-size:12px}
.liqScore{font-size:11px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.liqMeta{font-size:10px;color:var(--dim);margin-bottom:5px}
.liqBasis{font-size:11px;color:var(--muted);line-height:1.5}
.liqBar{height:4px;background:#1e2329;border-radius:2px;overflow:hidden;margin-top:6px}
.liqBar .fill{height:100%;background:linear-gradient(90deg,#f0b90b,#ef5350)}
.phaseBar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0;background:#1e2329}
.phaseBar .seg{height:100%;transition:width .3s}
.phaseBar .acc{background:#2962ff}
.phaseBar .man{background:#f0b90b}
.phaseBar .dis{background:#ef5350}
.empty{color:var(--muted);font-size:11.5px;text-align:center;padding:20px 10px;line-height:1.6}
.scanBar{height:6px;background:#1e2329;border-radius:3px;overflow:hidden;margin-bottom:8px;display:none}
.scanBar.on{display:block}
.scanBar .fill{height:100%;background:linear-gradient(90deg,#26a69a,#f0b90b);width:0%;transition:width .2s}
@media(max-width:900px){
  main{grid-template-columns:1fr;grid-template-rows:44vh 1fr}
  #right{border-left:none;border-top:1px solid var(--line)}
  .hsym{font-size:14px}.hprice{font-size:15px}
  .tf{padding:4px 8px;font-size:10px}
  .tab{padding:9px 10px;font-size:9px}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hrow">
      <div>
        <div class="hsym" id="hSym">BTC / USDT</div>
        <div class="hmeta" id="hMeta">5m · loading…</div>
      </div>
      <div>
        <div class="hprice" id="hPrice">—</div>
        <div class="hchg" id="hChg">—</div>
      </div>
    </div>
    <div id="tfbar"></div>
  </header>

  <main>
    <div id="chartWrap">
      <div id="chart"></div>
      <div id="chartOverlay"></div>
      <div id="chartStatus">connecting…</div>
    </div>

    <div id="right">
      <div id="tabs">
        <button class="tab on" data-p="signals">SIGNALS</button>
        <button class="tab" data-p="liquidity">LIQUIDITY</button>
        <button class="tab" data-p="smcict">SMC + ICT</button>
        <button class="tab" data-p="breakout">BREAKOUT</button>
        <button class="tab" data-p="structure">STRUCTURE</button>
        <button class="tab" data-p="analyze">ANALYZE</button>
      </div>
      <div id="panels">
        <div class="panel on" id="p-signals"><div id="signalsOut"></div></div>
        <div class="panel" id="p-liquidity">
          <div class="scanBar" id="liqScanBar"><div class="fill" id="liqScanFill"></div></div>
          <div id="liquidityOut"></div>
        </div>
        <div class="panel" id="p-smcict"><div id="smcictOut"></div></div>
        <div class="panel" id="p-breakout"><div id="breakoutOut"></div></div>
        <div class="panel" id="p-structure"><div id="structureOut"></div></div>
        <div class="panel" id="p-analyze"><div id="analyzeOut"></div></div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
"use strict";

/* ============================================================
   PART 1 — CONFIG · STATE · UTILS · INDICATORS · STRUCTURE · DATA
   ============================================================ */

/* ---------- CONFIG ---------- */
const COINS = [
  ["BTCUSDT","BTC"],["ETHUSDT","ETH"],["SOLUSDT","SOL"],["BNBUSDT","BNB"],
  ["XRPUSDT","XRP"],["ADAUSDT","ADA"],["DOGEUSDT","DOGE"],["AVAXUSDT","AVAX"],
  ["LINKUSDT","LINK"],["DOTUSDT","DOT"],["MATICUSDT","MATIC"],["LTCUSDT","LTC"],
  ["TRXUSDT","TRX"],["ATOMUSDT","ATOM"],["UNIUSDT","UNI"],["NEARUSDT","NEAR"],
  ["APTUSDT","APT"],["ARBUSDT","ARB"],["OPUSDT","OP"],["INJUSDT","INJ"],
  ["SUIUSDT","SUI"],["TIAUSDT","TIA"],["SEIUSDT","SEI"],["FILUSDT","FIL"]
];

const TF_SECONDS = {
  "1m":60,"5m":300,"15m":900,"30m":1800,
  "1h":3600,"4h":14400,"1d":86400
};
const TF_LIST  = ["1m","5m","15m","30m","1h","4h","1d"];
const HTF_LIST = ["4h","1d"];

const BINANCE_REST = "https://data-api.binance.vision";
const BINANCE_WS   = "wss://data-stream.binance.vision";
const FAPI         = "https://fapi.binance.com";

/* ---------- STATE ---------- */
const state = {
  sym: "BTCUSDT",
  name: "BTC",
  tf: "5m",
  candles: [],
  htf: { "4h": [], "1d": [] },
  klineWS: null,
  klineSeq: 0,
  wsRetry: 0,
  tickerData: {},
  signals: [],
  signalsSeen: new Set(),
  liquidityZones: [],
  breakouts: [],
  structure: [],
  choch: [],
  mss: [],
  smc: { ob: [], fvg: [] },
  ict: { phase: null, mix: { acc: 0, man: 0, dis: 0 }, killzone: null },
  panel: "signals",
  highlight: { markers: [], priceLines: [] },
  oi: null,
  funding: null,
  booted: false,
  lastTickTime: 0
};

/* ---------- UTILITIES ---------- */
const $ = id => document.getElementById(id);

function fmt(n){
  if(!isFinite(n) || n == null) return "—";
  const a = Math.abs(n);
  if(a >= 1000)   return n.toLocaleString("en-US",{maximumFractionDigits:2});
  if(a >= 1)      return n.toFixed(2);
  if(a >= 0.01)   return n.toFixed(4);
  if(a >= 0.0001) return n.toFixed(6);
  return n.toExponential(3);
}
function fmtPct(n){
  if(!isFinite(n)) return "—";
  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}
function fmtUSD(n){
  if(!isFinite(n)) return "—";
  const a = Math.abs(n);
  if(a >= 1e9) return "$" + (n/1e9).toFixed(2) + "B";
  if(a >= 1e6) return "$" + (n/1e6).toFixed(2) + "M";
  if(a >= 1e3) return "$" + (n/1e3).toFixed(1) + "K";
  return "$" + n.toFixed(2);
}
function fmtTime(sec){
  const d = new Date(sec * 1000);
  return d.toLocaleString([], { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function setStatus(msg, cls){
  const el = $("chartStatus");
  if(!el) return;
  el.textContent = msg;
  el.className = cls || "";
}
function tfSeconds(tf){ return TF_SECONDS[tf] || 300; }
function bucketTime(tf, sec){
  const s = tfSeconds(tf);
  return Math.floor(sec / s) * s;
}
function pctChange(a, b){ return b === 0 ? 0 : ((a - b) / b) * 100; }
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function last(arr){ return arr[arr.length-1]; }
function escapeHtml(s){
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- INDICATORS ---------- */
function ema(values, period){
  const out = new Array(values.length).fill(null);
  if(values.length < period) return out;
  const k = 2 / (period + 1);
  let s = 0;
  for(let i=0;i<period;i++) s += values[i];
  let prev = s / period;
  out[period-1] = prev;
  for(let i=period;i<values.length;i++){
    prev = values[i]*k + prev*(1-k);
    out[i] = prev;
  }
  return out;
}

function sma(values, period){
  const out = new Array(values.length).fill(null);
  if(values.length < period) return out;
  let s = 0;
  for(let i=0;i<values.length;i++){
    s += values[i];
    if(i >= period) s -= values[i-period];
    if(i >= period-1) out[i] = s / period;
  }
  return out;
}

function stdev(values, period){
  const out = new Array(values.length).fill(null);
  const m = sma(values, period);
  for(let i=period-1;i<values.length;i++){
    let s = 0;
    for(let j=i-period+1;j<=i;j++) s += Math.pow(values[j] - m[i], 2);
    out[i] = Math.sqrt(s / period);
  }
  return out;
}

function rsi(values, period){
  period = period || 14;
  const out = new Array(values.length).fill(null);
  if(values.length <= period) return out;
  let g = 0, l = 0;
  for(let i=1;i<=period;i++){
    const d = values[i] - values[i-1];
    if(d >= 0) g += d; else l -= d;
  }
  let ag = g / period, al = l / period;
  out[period] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
  for(let i=period+1;i<values.length;i++){
    const d = values[i] - values[i-1];
    ag = (ag * (period-1) + Math.max(d, 0)) / period;
    al = (al * (period-1) + Math.max(-d, 0)) / period;
    out[i] = al === 0 ? 100 : 100 - 100/(1 + ag/al);
  }
  return out;
}

function atrSeries(candles, period){
  period = period || 14;
  const tr = candles.map((c,i) => {
    if(i === 0) return c.high - c.low;
    const pc = candles[i-1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  });
  const out = new Array(candles.length).fill(null);
  if(candles.length < period) return out;
  let s = 0;
  for(let i=0;i<period;i++) s += tr[i];
  let prev = s / period;
  out[period-1] = prev;
  for(let i=period;i<candles.length;i++){
    prev = (prev * (period-1) + tr[i]) / period;
    out[i] = prev;
  }
  return out;
}

function macd(values){
  const e12 = ema(values, 12);
  const e26 = ema(values, 26);
  const line = values.map((_,i) =>
    (e12[i] != null && e26[i] != null) ? e12[i] - e26[i] : null);
  const clean = line.map(x => x == null ? 0 : x);
  const sig = ema(clean, 9).map((x,i) => line[i] == null ? null : x);
  const hist = line.map((x,i) =>
    (x != null && sig[i] != null) ? x - sig[i] : null);
  return { line, sig, hist };
}

function vwap(candles){
  const out = new Array(candles.length).fill(null);
  let cumPV = 0, cumV = 0, dayStart = -1;
  for(let i=0;i<candles.length;i++){
    const day = Math.floor(candles[i].time / 86400);
    if(day !== dayStart){ cumPV = 0; cumV = 0; dayStart = day; }
    const typical = (candles[i].high + candles[i].low + candles[i].close) / 3;
    cumPV += typical * candles[i].volume;
    cumV += candles[i].volume;
    out[i] = cumV ? cumPV / cumV : null;
  }
  return out;
}

function supertrend(candles, period, mult){
  period = period || 10;
  mult = mult || 3;
  const atr = atrSeries(candles, period);
  const dir = new Array(candles.length).fill(null);
  const trend = new Array(candles.length).fill(null);
  let lastDir = 1, lastUp = null, lastLo = null;
  for(let i=0;i<candles.length;i++){
    if(atr[i] == null) continue;
    const mid = (candles[i].high + candles[i].low) / 2;
    const up = mid + mult * atr[i];
    const lo = mid - mult * atr[i];
    const fu = (lastUp != null && candles[i-1] && candles[i-1].close <= lastUp)
      ? Math.min(up, lastUp) : up;
    const fl = (lastLo != null && candles[i-1] && candles[i-1].close >= lastLo)
      ? Math.max(lo, lastLo) : lo;
    let d = lastDir;
    if(lastDir === 1 && candles[i].close < fl) d = -1;
    else if(lastDir === -1 && candles[i].close > fu) d = 1;
    dir[i] = d;
    trend[i] = d === 1 ? fl : fu;
    lastUp = fu;
    lastLo = fl;
    lastDir = d;
  }
  return { dir, trend };
}

/* ---------- SWING / STRUCTURE ENGINE ---------- */
function detectSwings(candles, strength){
  strength = strength || 3;
  const highs = [], lows = [];
  for(let i=strength;i<candles.length-strength;i++){
    let isH = true, isL = true;
    for(let j=i-strength;j<=i+strength;j++){
      if(j === i) continue;
      if(candles[j].high >= candles[i].high) isH = false;
      if(candles[j].low  <= candles[i].low)  isL = false;
    }
    if(isH) highs.push({ i, price: candles[i].high, time: candles[i].time });
    if(isL) lows.push({ i, price: candles[i].low,  time: candles[i].time });
  }
  return { highs, lows };
}

function detectBOS(candles){
  const { highs, lows } = detectSwings(candles, 3);
  const merged = [
    ...highs.map(h => ({ ...h, kind: "H" })),
    ...lows.map(l  => ({ ...l, kind: "L" }))
  ].sort((a,b) => a.i - b.i);

  const events = [];
  let lastHigh = null, lastLow = null, bias = null;

  for(const p of merged){
    if(p.kind === "H"){
      if(lastHigh && p.price > lastHigh.price && bias !== "up"){
        events.push({
          type: "BOS", dir: "up",
          price: lastHigh.price, time: p.time, i: p.i,
          evidence: "Higher high broke prior swing high " + fmt(lastHigh.price)
        });
        bias = "up";
      }
      lastHigh = p;
    } else {
      if(lastLow && p.price < lastLow.price && bias !== "down"){
        events.push({
          type: "BOS", dir: "down",
          price: lastLow.price, time: p.time, i: p.i,
          evidence: "Lower low broke prior swing low " + fmt(lastLow.price)
        });
        bias = "down";
      }
      lastLow = p;
    }
  }
  return events;
}

function detectCHoCH(candles){
  const bos = detectBOS(candles);
  const out = [];
  let prevDir = null;
  for(const e of bos){
    if(prevDir && e.dir !== prevDir){
      out.push({
        ...e, type: "CHoCH",
        evidence: "First " + e.dir.toUpperCase() +
                  " break against prior " + prevDir.toUpperCase() + " bias"
      });
    }
    prevDir = e.dir;
  }
  return out;
}

function detectMSS(candles){
  const choch = detectCHoCH(candles);
  const out = [];
  for(let i=1;i<choch.length;i++){
    const c = choch[i];
    const p = choch[i-1];
    if(c.dir !== p.dir){
      out.push({
        ...c, type: "MSS",
        evidence: "Structure shifted " + p.dir.toUpperCase() +
                  " → " + c.dir.toUpperCase() + " at " + fmt(c.price)
      });
    }
  }
  return out;
}

/* WebSocket — klines for the active symbol + timeframe */
function startKlineStream(sym, tf){
  if(state.klineWS){
    try { state.klineWS.close(); } catch(e){}
    state.klineWS = null;
  }
  state.wsRetry = 0;

  const url = BINANCE_WS + "/ws/" + sym.toLowerCase() + "@kline_" + tf;
  const ws = new WebSocket(url);
  state.klineWS = ws;

  ws.onopen = () => {
    state.wsRetry = 0;
    setStatus(state.name + " · " + tf + " · live", "live");
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if(!msg.k || !msg.k.x === undefined) return;
      const k = msg.k;
      const candle = {
        time: Math.floor(k.t / 1000),
        open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v
      };
      onKlineUpdate(candle, k.x);
    } catch(err){}
  };

  ws.onerror = () => {
    /* onclose handles reconnect */
  };

  ws.onclose = () => {
    if(state.klineWS !== ws) return;   /* superseded */
    const delay = Math.min(30000, 1000 * Math.pow(2, state.wsRetry++));
    setStatus("reconnecting in " + Math.round(delay/1000) + "s…", "err");
    setTimeout(() => {
      if(state.klineWS !== ws) return;
      startKlineStream(state.sym, state.tf);
    }, delay);
  };
}

/* Ticker stream — miniTicker for all coins, updates header */
function startTickerStream(){
  const streams = COINS.map(c => c[0].toLowerCase() + "@miniTicker").join("/");
  const url = BINANCE_WS + "/stream?streams=" + streams;
  const ws = new WebSocket(url);

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      const d = msg.data;
      if(!d || !d.s) return;
      const price = parseFloat(d.c);
      const open  = parseFloat(d.o);
      state.tickerData[d.s] = {
        price,
        open,
        pct: open === 0 ? 0 : ((price - open) / open) * 100
      };
      if(d.s === state.sym) updateHeader(d.s, price, state.tickerData[d.s].pct);
    } catch(err){}
  };

  ws.onclose = () => {
    setTimeout(startTickerStream, 5000);
  };
}

function updateHeader(sym, price, pct){
  const p = $("hPrice");
  const c = $("hChg");
  if(p) p.textContent = fmt(price);
  if(c){
    c.textContent = fmtPct(pct);
    c.className = pct >= 0 ? "hchg up" : "hchg down";
  }
}

/* This is the single entry point where new candle data lands.
   Part 2 and Part 3 attach their signal detectors to it.       */
function onKlineUpdate(candle, isClosed){
  const arr = state.candles;
  if(!arr.length){
    arr.push(candle);
  } else if(arr[arr.length-1].time === candle.time){
    arr[arr.length-1] = candle;
  } else if(candle.time > arr[arr.length-1].time){
    arr.push(candle);
    if(arr.length > 1000) arr.shift();
  } else {
    return; /* out-of-order, ignore */
  }
  /* Chart redraw + engine passes happen in Part 3.
     Guarded so Part 1 alone is safe to load. */
  if(typeof renderChartUpdate === "function") renderChartUpdate(candle, isClosed);
  if(typeof runEngines === "function") runEngines();
}

/* Part 2 adds:
     - Liquidity engine (BSL / SSL / EQH / EQL / PDH-PDL / sweeps / pools)
     - ICT (Accumulation / Manipulation / Distribution + killzones)
     - SMC (Order Blocks + FVG) merged with ICT
     - Advanced breakout engine (strength · volume · displacement · retest)
*/
 /* ============================================================
   PART 2 — LIQUIDITY · ICT · SMC
   ============================================================ */

/* ---------- LIQUIDITY ENGINE ----------
   Produces zones of *estimated* liquidity. Every zone carries:
     score  — 0..100, higher = more likely to hold resting orders
     basis  — human-readable reasons (evidence, not labels)
     hot    — true if score >= threshold (unusual concentration)
*/

const LIQ_HOT_THRESHOLD = 65;

function detectEqualLevels(swings, tolerancePct){
  tolerancePct = tolerancePct || 0.0015;
  const groups = [];
  const used = new Set();
  for(let i=0;i<swings.length;i++){
    if(used.has(i)) continue;
    const a = swings[i];
    const grp = {
      price: a.price, touches: 1,
      firstTime: a.time, lastTime: a.time,
      idx: [a.i]
    };
    for(let j=i+1;j<swings.length;j++){
      if(used.has(j)) continue;
      const b = swings[j];
      if(Math.abs(b.price - a.price) / a.price < tolerancePct){
        grp.price = (grp.price * grp.touches + b.price) / (grp.touches + 1);
        grp.touches++;
        grp.lastTime = b.time;
        grp.idx.push(b.i);
        used.add(j);
      }
    }
    if(grp.touches >= 2) groups.push(grp);
    used.add(i);
  }
  return groups;
}

function volumeAtPrice(candles, price, rangePct){
  rangePct = rangePct || 0.01;
  let v = 0;
  for(const c of candles){
    const mid = (c.high + c.low) / 2;
    if(Math.abs(mid - price) / price <= rangePct) v += c.volume;
  }
  return v;
}

function scoreLiquidity(zone, candles, htf){
  let score = 0;
  const basis = [];

  /* touches */
  if(zone.touches >= 5){ score += 40; basis.push(zone.touches + " touches — major cluster"); }
  else if(zone.touches >= 3){ score += 25; basis.push(zone.touches + " touches"); }
  else { score += 10; basis.push(zone.touches + " touch" + (zone.touches>1?"es":"")); }

  /* recency: how many bars since last touch */
  let barsAgo = 9999;
  for(let i=candles.length-1;i>=0;i--){
    if(candles[i].time <= zone.lastTime){ barsAgo = candles.length - 1 - i; break; }
  }
  if(barsAgo < 30){ score += 15; basis.push("interacted within last 30 bars"); }
  else if(barsAgo < 100){ score += 8; basis.push("recent interaction (" + barsAgo + " bars ago)"); }

  /* HTF agreement */
  const in4h = htf["4h"] && htf["4h"].some(c => zone.price >= c.low && zone.price <= c.high);
  const in1d = htf["1d"] && htf["1d"].some(c => zone.price >= c.low && zone.price <= c.high);
  if(in4h){ score += 15; basis.push("sits inside 4H structure"); }
  if(in1d){ score += 20; basis.push("sits inside 1D structure"); }

  /* volume at price */
  const totalV = candles.reduce((a,c) => a + c.volume, 0);
  const volHere = volumeAtPrice(candles, zone.price, 0.01);
  const volRatio = totalV ? volHere / totalV : 0;
  if(volRatio > 0.08){ score += 20; basis.push("high volume traded at this price"); }
  else if(volRatio > 0.04){ score += 10; basis.push("moderate volume node"); }

  /* distance from current price */
  const px = candles[candles.length-1].close;
  const distPct = Math.abs(zone.price - px) / px * 100;
  if(distPct < 3){ score += 5; basis.push("very near current price"); }
  else if(distPct > 15){ score -= 10; basis.push("far from price (" + distPct.toFixed(1) + "%)"); }

  return { score: clamp(score, 0, 100), basis, distPct };
}

function detectSweeps(candles){
  const { highs, lows } = detectSwings(candles, 3);
  const out = [];

  for(const h of highs.slice(-15)){
    const after = candles.slice(h.i + 1, h.i + 21);
    for(const c of after){
      const upperWick = c.high - Math.max(c.open, c.close);
      const body = Math.abs(c.close - c.open);
      if(c.high > h.price && c.close < h.price && upperWick > body * 1.5){
        out.push({
          kind: "BSL",
          price: h.price,
          time: c.time,
          wickRatio: upperWick / Math.max(body, 1e-9),
          evidence: "Wick pierced swing high " + fmt(h.price) +
                    " then closed back below — buy-side liquidity swept"
        });
        break;
      }
    }
  }

  for(const l of lows.slice(-15)){
    const after = candles.slice(l.i + 1, l.i + 21);
    for(const c of after){
      const lowerWick = Math.min(c.open, c.close) - c.low;
      const body = Math.abs(c.close - c.open);
      if(c.low < l.price && c.close > l.price && lowerWick > body * 1.5){
        out.push({
          kind: "SSL",
          price: l.price,
          time: c.time,
          wickRatio: lowerWick / Math.max(body, 1e-9),
          evidence: "Wick pierced swing low " + fmt(l.price) +
                    " then closed back above — sell-side liquidity swept"
        });
        break;
      }
    }
  }
  return out.sort((a,b) => a.time - b.time).slice(-12);
}

function detectPDHPDL(candles){
  /* Previous day high/low from the 1D series (not the current TF) */
  const out = [];
  const d1 = state.htf["1d"];
  if(!d1 || d1.length < 2) return out;
  const prevDay = d1[d1.length - 2];
  out.push({ price: prevDay.high, type: "BSL", label: "Previous day high (PDH)" });
  out.push({ price: prevDay.low,  type: "SSL", label: "Previous day low (PDL)"  });

  /* Previous week high/low — group 1D bars into weeks */
  if(d1.length >= 8){
    const weekStart = Math.floor(d1[d1.length-1].time / 604800) * 604800;
    const thisWeek = d1.filter(c => c.time >= weekStart);
    const lastWeek = d1.filter(c => c.time < weekStart);
    if(lastWeek.length){
      const pwh = Math.max(...lastWeek.map(c => c.high));
      const pwl = Math.min(...lastWeek.map(c => c.low));
      out.push({ price: pwh, type: "BSL", label: "Previous week high (PWH)" });
      out.push({ price: pwl, type: "SSL", label: "Previous week low (PWL)"  });
    }
  }
  return out;
}

function detectLiquidityPools(candles, eqLevels){
  /* A "pool" = equal level with 3+ touches → thick band of resting orders */
  const out = [];
  for(const g of eqLevels){
    if(g.touches >= 3){
      out.push({
        price: g.price,
        touches: g.touches,
        evidence: g.touches + " equal highs/lows within 0.2% — resting-order pool"
      });
    }
  }
  return out;
}

function detectInducement(candles){
  /* Inducement: a minor high/low that forms BEFORE a real move,
     trapping early entries. We look for a small swing that precedes
     a BOS against it. */
  const bos = detectBOS(candles);
  const { highs, lows } = detectSwings(candles, 3);
  const out = [];

  for(const b of bos){
    if(b.dir === "up"){
      const candidates = lows.filter(l => l.i < b.i && b.i - l.i < 40);
      if(candidates.length){
        const l = candidates[candidates.length - 1];
        out.push({
          side: "long",
          price: l.price,
          time: l.time,
          evidence: "Minor swing low " + fmt(l.price) +
                    " swept before bullish BOS at " + fmt(b.price) +
                    " — likely inducement"
        });
      }
    } else {
      const candidates = highs.filter(h => h.i < b.i && b.i - h.i < 40);
      if(candidates.length){
        const h = candidates[candidates.length - 1];
        out.push({
          side: "short",
          price: h.price,
          time: h.time,
          evidence: "Minor swing high " + fmt(h.price) +
                    " swept before bearish BOS at " + fmt(b.price) +
                    " — likely inducement"
        });
      }
    }
  }
  return out.slice(-6);
}

function detectDisplacement(candles){
  /* Displacement = candle whose body is much larger than recent ATR and
     closes near its extreme — sign of aggressive repricing. */
  const atr = atrSeries(candles, 14);
  const out = [];
  for(let i=15;i<candles.length;i++){
    if(atr[i] == null) continue;
    const c = candles[i];
    const body = Math.abs(c.close - c.open);
    const range = c.high - c.low || 1e-9;
    const ratio = body / Math.max(atr[i], 1e-9);
    const closeNearExtreme =
      body / range > 0.7 &&
      (c.close > c.open ? (c.close - c.low)/range > 0.7
                        : (c.high - c.close)/range > 0.7);
    if(ratio > 1.6 && closeNearExtreme){
      out.push({
        time: c.time,
        dir: c.close > c.open ? "up" : "down",
        magnitude: ratio,
        price: c.close,
        evidence: "Body " + ratio.toFixed(2) + "× ATR(14), closed near extreme — displacement"
      });
    }
  }
  return out.slice(-10);
}

function detectLiquidityVoids(candles){
  /* A void = large candle with no opposing wicks — price gapped through
     that area with little resting liquidity. Equivalent to a wide FVG. */
  const out = [];
  for(let i=2;i<candles.length;i++){
    const c = candles[i];
    const range = c.high - c.low || 1e-9;
    const body = Math.abs(c.close - c.open);
    if(body / range > 0.85 && range > atrSeries(candles, 14)[i] * 1.3){
      out.push({
        low: Math.min(c.open, c.close),
        high: Math.max(c.open, c.close),
        time: c.time,
        dir: c.close > c.open ? "up" : "down",
        evidence: "Candle ran " + fmt(c.low) + " → " + fmt(c.high) +
                  " with no opposing wick — liquidity void"
      });
    }
  }
  return out.slice(-6);
}

function detectInternalExternal(candles){
  /* External = the current range's extremes (major swing highs/lows).
     Internal = the structure *inside* that range. */
  const { highs, lows } = detectSwings(candles, 5);
  if(!highs.length || !lows.length) return { external: null, internal: [] };
  const externalHigh = Math.max(...highs.slice(-6).map(h => h.price));
  const externalLow  = Math.min(...lows.slice(-6).map(l  => l.price));
  const internal = [];
  for(const h of highs.slice(-12)) if(h.price < externalHigh) internal.push({ side: "H", price: h.price });
  for(const l of lows.slice(-12))  if(l.price > externalLow)  internal.push({ side: "L", price: l.price });
  return {
    external: { high: externalHigh, low: externalLow },
    internal: internal.slice(-8)
  };
}

function buildLiquidityZones(candles, htf){
  if(candles.length < 40) return [];
  const { highs, lows } = detectSwings(candles, 5);
  const zones = [];

  /* Equal highs → BSL above */
  const eqH = detectEqualLevels(highs, 0.002);
  for(const g of eqH){
    const s = scoreLiquidity(g, candles, htf);
    zones.push({
      type: "BSL", label: "Equal highs",
      price: g.price, touches: g.touches,
      score: s.score, basis: s.basis, hot: s.score >= LIQ_HOT_THRESHOLD,
      distPct: s.distPct
    });
  }

  /* Equal lows → SSL below */
  const eqL = detectEqualLevels(lows, 0.002);
  for(const g of eqL){
    const s = scoreLiquidity(g, candles, htf);
    zones.push({
      type: "SSL", label: "Equal lows",
      price: g.price, touches: g.touches,
      score: s.score, basis: s.basis, hot: s.score >= LIQ_HOT_THRESHOLD,
      distPct: s.distPct
    });
  }

  /* Recent single swings */
  for(const h of highs.slice(-6)){
    const g = { price: h.price, touches: 1, lastTime: h.time };
    const s = scoreLiquidity(g, candles, htf);
    if(s.score >= 40){
      zones.push({
        type: "BSL", label: "Swing high",
        price: h.price, touches: 1,
        score: s.score, basis: s.basis, hot: s.score >= LIQ_HOT_THRESHOLD,
        distPct: s.distPct
      });
    }
  }
  for(const l of lows.slice(-6)){
    const g = { price: l.price, touches: 1, lastTime: l.time };
    const s = scoreLiquidity(g, candles, htf);
    if(s.score >= 40){
      zones.push({
        type: "SSL", label: "Swing low",
        price: l.price, touches: 1,
        score: s.score, basis: s.basis, hot: s.score >= LIQ_HOT_THRESHOLD,
        distPct: s.distPct
      });
    }
  }

  /* PDH / PDL / PWH / PWL */
  const pd = detectPDHPDL(candles);
  for(const p of pd){
    const g = { price: p.price, touches: 2, lastTime: candles[candles.length-1].time };
    const s = scoreLiquidity(g, candles, htf);
    zones.push({
      type: p.type, label: p.label,
      price: p.price, touches: 2,
      score: s.score, basis: s.basis, hot: s.score >= LIQ_HOT_THRESHOLD,
      distPct: s.distPct
    });
  }

  /* Dedupe close zones, keep highest score */
  zones.sort((a,b) => b.score - a.score);
  const kept = [];
  for(const z of zones){
    if(kept.some(k => Math.abs(k.price - z.price) / z.price < 0.002)) continue;
    kept.push(z);
  }
  return kept.slice(0, 20);
}

/* ---------- ICT MODULE ---------- */

function detectKillzone(){
  const h = new Date().getUTCHours();
  if(h >= 0  && h < 4)  return { name: "Asian KZ",   range: "00–04 UTC", active: true };
  if(h >= 7  && h < 10) return { name: "London KZ",  range: "07–10 UTC", active: true };
  if(h >= 13 && h < 16) return { name: "NY AM KZ",   range: "13–16 UTC", active: true };
  if(h >= 17 && h < 20) return { name: "NY PM KZ",   range: "17–20 UTC", active: true };
  return { name: "Between KZ", range: "no active killzone", active: false };
}

/**
 * AMD (Accumulation / Manipulation / Distribution).
 * Uses the last N 4H candles to classify the current phase.
 * Returns a weighted mix so the UI can show partial phase conviction.
 *
 *   Accumulation → low range, volume drying, price inside prior range
 *   Manipulation → sweep of prior extreme, displacement, volume spike
 *   Distribution → directional expansion, expanding range, trend continuation
 */
function detectAMDPhase(htf){
  const d4 = htf["4h"];
  if(!d4 || d4.length < 30) return null;

  const recent = d4.slice(-12);
  const prior  = d4.slice(-30, -12);
  if(!recent.length || !prior.length) return null;

  const rangeRecent = Math.max(...recent.map(c=>c.high)) -
                      Math.min(...recent.map(c=>c.low));
  const rangePrior  = Math.max(...prior.map(c=>c.high))  -
                      Math.min(...prior.map(c=>c.low));
  const rangeRatio  = rangePrior ? rangeRecent / rangePrior : 1;

  const volRecent = recent.reduce((a,c)=>a+c.volume,0) / recent.length;
  const volPrior  = prior.reduce((a,c)=>a+c.volume,0)  / prior.length;
  const volRatio  = volPrior ? volRecent / volPrior : 1;

  const priorHigh = Math.max(...prior.map(c=>c.high));
  const priorLow  = Math.min(...prior.map(c=>c.low));
  const lastClose = d4[d4.length-1].close;

  let sweptHigh = false, sweptLow = false;
  for(const c of recent){
    if(c.high > priorHigh && c.close < priorHigh) sweptHigh = true;
    if(c.low  < priorLow  && c.close > priorLow)  sweptLow  = true;
  }

  const e20 = ema(d4.map(c=>c.close), 20);
  const e50 = ema(d4.map(c=>c.close), 50);
  const trendUp = e20[e20.length-1] != null && e50[e50.length-1] != null
                && e20[e20.length-1] > e50[e50.length-1];

  /* Weight each phase 0..100 */
  let acc = 0, man = 0, dis = 0;

  if(rangeRatio < 0.7) acc += 40;
  else if(rangeRatio < 0.9) acc += 20;
  if(volRatio < 0.8) acc += 30;
  else if(volRatio < 1) acc += 15;
  if(lastClose > priorLow && lastClose < priorHigh) acc += 20;

  if(sweptHigh || sweptLow) man += 50;
  if(volRatio > 1.4) man += 25;
  if(rangeRatio > 1.1) man += 15;

  if(rangeRatio > 1.3) dis += 35;
  if(trendUp !== null) dis += 20;
  if(volRatio > 1.2) dis += 20;
  if(Math.abs(lastClose - priorHigh) / priorHigh < 0.02 ||
     Math.abs(lastClose - priorLow)  / priorLow  < 0.02) dis += 15;

  const total = acc + man + dis || 1;
  const mix = {
    acc: Math.round(acc / total * 100),
    man: Math.round(man / total * 100),
    dis: Math.round(dis / total * 100)
  };

  let phase = "Unclear";
  if(mix.acc >= mix.man && mix.acc >= mix.dis) phase = "Accumulation";
  else if(mix.man >= mix.dis) phase = "Manipulation";
  else phase = "Distribution";

  const basis = [];
  basis.push("Range " + rangeRatio.toFixed(2) + "× prior 30-bar range");
  basis.push("Volume " + volRatio.toFixed(2) + "× prior 30-bar average");
  if(sweptHigh) basis.push("Recent sweep of prior 4H swing high");
  if(sweptLow)  basis.push("Recent sweep of prior 4H swing low");
  basis.push("4H EMA20 " + (trendUp ? "above" : "below") + " EMA50");

  return { phase, mix, basis, rangeRatio, volRatio, sweptHigh, sweptLow, trendUp };
}

/* ---------- SMC MODULE (Order Blocks + FVG) ---------- */

function detectOrderBlocks(candles, bos){
  const out = [];
  for(const b of bos.slice(-8)){
    for(let i=b.i;i>=Math.max(0, b.i - 12);i--){
      const c = candles[i];
      const isOpp = b.dir === "up" ? c.close < c.open : c.close > c.open;
      if(isOpp){
        out.push({
          dir: b.dir === "up" ? "bull" : "bear",
          high: c.high, low: c.low,
          time: c.time,
          evidence: (b.dir === "up" ? "Last down candle" : "Last up candle") +
                    " before BOS — " + fmt(c.low) + " → " + fmt(c.high)
        });
        break;
      }
    }
  }
  return out.slice(-6);
}

function detectFVG(candles){
  const out = [];
  for(let i=2;i<candles.length;i++){
    const a = candles[i-2], c = candles[i];
    if(a.high < c.low){
      out.push({
        dir: "bull", low: a.high, high: c.low, time: c.time,
        evidence: "Bullish FVG " + fmt(a.high) + " → " + fmt(c.low) +
                  " (gap between candle " + (i-2) + " and " + i + ")"
      });
    }
    if(a.low > c.high){
      out.push({
        dir: "bear", low: c.high, high: a.low, time: c.time,
        evidence: "Bearish FVG " + fmt(c.high) + " → " + fmt(a.low)
      });
    }
  }
  return out.slice(-10);
}

/* Combined SMC + ICT: cross-references the two, drops duplicates,
   surfaces where an OB sits inside an FVG (highest-confluence SMC+ICT). */
function buildSMCICT(candles, htf){
  const bos   = detectBOS(candles);
  const ob    = detectOrderBlocks(candles, bos);
  const fvg   = detectFVG(candles);
  const amd   = detectAMDPhase(htf);
  const kz    = detectKillzone();
  const disp  = detectDisplacement(candles);
  const sweeps = detectSweeps(candles);

  /* Overlap: OB that contains or abuts an FVG → strong confluence */
  const confluence = [];
  for(const o of ob){
    for(const f of fvg){
      const overlap = Math.min(o.high, f.high) - Math.max(o.low, f.low);
      if(overlap > 0 && o.dir === f.dir){
        confluence.push({
          low: Math.max(o.low, f.low),
          high: Math.min(o.high, f.high),
          dir: o.dir,
          evidence: "Order block overlapping " + f.dir + " FVG — SMC + ICT confluence"
        });
      }
    }
  }

  return { bos, ob, fvg, amd, killzone: kz, displacement: disp, sweeps, confluence };
}

/* ---------- ADVANCED BREAKOUT ENGINE ---------- */

/**
 * A breakout is scored by combining:
 *   structure break (BOS)
 *   volume expansion vs recent average
 *   displacement magnitude
 *   sweep before breakout (retail trap = false-break risk)
 *   retest behaviour (hold vs fail)
 *   HTF alignment (4H bias)
 *   momentum (EMA20 slope)
 * Output: score 0..100, label GENUINE | SUSPECT | FAKE
 */
function scoreBreakout(b, candles, htf, sweeps, disp){
  const basis = [];
  let score = 0;

  /* 1. Volume confirmation */
  const volHere = candles[b.i].volume;
  const volAvg  = avgVolumeBefore(candles, 20, b.i);
  const volRatio = volAvg ? volHere / volAvg : 1;
  if(volRatio > 2){ score += 25; basis.push("volume " + volRatio.toFixed(2) + "× avg — confirmed"); }
  else if(volRatio > 1.3){ score += 15; basis.push("volume " + volRatio.toFixed(2) + "× avg — supportive"); }
  else { score -= 10; basis.push("volume " + volRatio.toFixed(2) + "× avg — thin"); }

  /* 2. Displacement nearby (±3 bars) */
  const nearbyDisp = disp.find(d => Math.abs(
    candles.findIndex(c => c.time === d.time) - b.i) <= 3);
  if(nearbyDisp && nearbyDisp.dir === b.dir){
    score += 20;
    basis.push("displacement candle " + nearbyDisp.magnitude.toFixed(2) + "× ATR confirms");
  }

  /* 3. Sweep before breakout = retail trap risk */
  const sweepBefore = sweeps.find(s =>
    s.kind === (b.dir === "up" ? "SSL" : "BSL") &&
    s.time <= b.time &&
    candles.findIndex(c => c.time === s.time) >= b.i - 15);
  if(sweepBefore){
    score -= 15;
    basis.push("liquidity swept " + (b.i - candles.findIndex(c => c.time === sweepBefore.time)) +
               " bars before — possible inducement");
  }

  /* 4. HTF alignment */
  const d4 = htf["4h"];
  if(d4 && d4.length >= 20){
    const e20 = ema(d4.map(c => c.close), 20);
    const htfDir = e20[e20.length-1] != null && d4[d4.length-1].close > e20[e20.length-1]
      ? "up" : "down";
    if(htfDir === b.dir){ score += 20; basis.push("aligned with 4H trend"); }
    else { score -= 10; basis.push("against 4H trend"); }
  }

  /* 5. Momentum (EMA20 slope on current TF) */
  const e20 = ema(candles.map(c => c.close), 20);
  if(e20[b.i] != null && e20[Math.max(0, b.i-5)] != null){
    const slope = e20[b.i] - e20[b.i-5];
    if((b.dir === "up" && slope > 0) || (b.dir === "down" && slope < 0)){
      score += 15; basis.push("EMA20 slope supports direction");
    } else {
      score -= 5; basis.push("EMA20 slope opposing");
    }
  }

  /* 6. Retest (look for a retest within 10 bars after the break) */
  let retested = false, retestHeld = false;
  for(let k=b.i+1;k<Math.min(candles.length, b.i+11);k++){
    const c = candles[k];
    if(b.dir === "up" && c.low <= b.price && c.close > b.price){ retested = true; retestHeld = true; break; }
    if(b.dir === "down" && c.high >= b.price && c.close < b.price){ retested = true; retestHeld = true; break; }
    if(b.dir === "up" && c.close < b.price * 0.997) break;
    if(b.dir === "down" && c.close > b.price * 1.003) break;
  }
  if(retested && retestHeld){ score += 15; basis.push("retested and held as support/resistance"); }
  else if(retested){ score -= 5; basis.push("retest did not hold"); }

  score = clamp(score, 0, 100);
  const label = score >= 70 ? "GENUINE" : score >= 45 ? "SUSPECT" : "FAKE";
  return { score, label, basis, volRatio, retested, retestHeld };
}

function avgVolumeBefore(candles, period, endIdx){
  const start = Math.max(0, endIdx - period);
  if(endIdx - start < 1) return 0;
  let s = 0;
  for(let i=start;i<endIdx;i++) s += candles[i].volume;
  return s / (endIdx - start);
}

function detectBreakouts(candles, htf, sweeps, disp){
  const bos = detectBOS(candles);
  const out = [];
  for(const b of bos.slice(-8)){
    const s = scoreBreakout(b, candles, htf, sweeps, disp);
    out.push({ ...b, ...s, type: "BREAKOUT" });
  }
  return out;
}

/* ---------- ALGORITHM / MODEL DETECTION ----------
   Looks at structure + liquidity + volume + displacement and decides
   which market model is most likely in control right now. Evidence
   for each model is returned so nothing is asserted without a reason.
*/

const MODELS = {
  TREND_CONTINUATION: "Trend continuation",
  RANGE_MEAN_REVERT:  "Range mean-reversion",
  LIQUIDITY_HUNT:     "Liquidity hunt / stop-run",
  ACCUMULATION:       "Accumulation",
  DISTRIBUTION:       "Distribution",
  EXPANSION:          "Volatility expansion",
  FVG_FILL:           "FVG / imbalance fill"
};

function detectAlgorithmModel(candles, htf, liq, smcict){
  if(candles.length < 40) return null;

  const atr = atrSeries(candles, 14);
  const atrNow = last(atr);
  const atrPrev = atr[atr.length - 20] || atrNow;
  const volNow = candles.slice(-5).reduce((a,c) => a + c.volume, 0) / 5;
  const volPrev = candles.slice(-30, -5).reduce((a,c) => a + c.volume, 0) / 25;
  const volRatio = volPrev ? volNow / volPrev : 1;
  const rangeNow = Math.max(...candles.slice(-10).map(c => c.high)) -
                   Math.min(...candles.slice(-10).map(c => c.low));
  const rangePrev = Math.max(...candles.slice(-40, -10).map(c => c.high)) -
                    Math.min(...candles.slice(-40, -10).map(c => c.low));
  const rangeRatio = rangePrev ? rangeNow / rangePrev : 1;

  const e20 = ema(candles.map(c => c.close), 20);
  const e50 = ema(candles.map(c => c.close), 50);
  const trendUp = e20[e20.length-1] > e50[e50.length-1];
  const alignedHTF = (() => {
    const d4 = htf["4h"];
    if(!d4 || d4.length < 25) return null;
    const h20 = ema(d4.map(c => c.close), 20);
    const h50 = ema(d4.map(c => c.close), 50);
    return h20[h20.length-1] > h50[h50.length-1] ? "up" : "down";
  })();

  const hotLiquidity = liq.filter(z => z.hot).length;
  const recentSweeps = smcict.sweeps.filter(s =>
    candles[candles.length-1].time - s.time < 3600 * 6);

  const scores = {};
  const reasons = {};

  function add(model, weight, why){
    scores[model] = (scores[model] || 0) + weight;
    if(!reasons[model]) reasons[model] = [];
    reasons[model].push(why);
  }

  if(alignedHTF && ((alignedHTF === "up") === trendUp) && rangeRatio > 0.9){
    add(MODELS.TREND_CONTINUATION, 30, "HTF trend and local trend aligned");
  }
  if(rangeRatio < 0.7 && volRatio < 0.9){
    add(MODELS.RANGE_MEAN_REVERT, 25, "Compressed range and declining volume");
    add(MODELS.ACCUMULATION, 20, "Range contraction with dry volume");
  }
  if(recentSweeps.length){
    add(MODELS.LIQUIDITY_HUNT, 40, recentSweeps.length + " recent liquidity sweep(s)");
  }
  if(smcict.amd){
    if(smcict.amd.phase === "Manipulation"){
      add(MODELS.LIQUIDITY_HUNT, 30, "4H AMD phase: manipulation");
    }
    if(smcict.amd.phase === "Accumulation"){
      add(MODELS.ACCUMULATION, 35, "4H AMD phase: accumulation");
    }
    if(smcict.amd.phase === "Distribution"){
      add(MODELS.DISTRIBUTION, 35, "4H AMD phase: distribution");
    }
  }
  if(rangeRatio > 1.4 && volRatio > 1.3){
    add(MODELS.EXPANSION, 35, "Range and volume both expanding");
  }
  const openFVG = smcict.fvg.filter(f => {
    const px = candles[candles.length-1].close;
    return px >= f.low && px <= f.high;
  });
  if(openFVG.length){
    add(MODELS.FVG_FILL, 25, openFVG.length + " FVG(s) currently being filled");
  }
  if(hotLiquidity >= 3){
    add(MODELS.LIQUIDITY_HUNT, 20, hotLiquidity + " high-score liquidity zones on chart");
  }

  const ranked = Object.entries(scores)
    .map(([model, score]) => ({ model, score, reasons: reasons[model] || [] }))
    .sort((a,b) => b.score - a.score);

  if(!ranked.length) return null;

  const total = ranked.reduce((a,b) => a + b.score, 0);
  const top = ranked[0];
  const confidence = Math.round(top.score / total * 100);

  return {
    model: top.model,
    confidence,
    reasons: top.reasons,
    alternatives: ranked.slice(1, 3).map(r => ({
      model: r.model,
      confidence: Math.round(r.score / total * 100)
    })),
    all: ranked
  };
}

/* ---------- UNIFIED SIGNAL REGISTRY ----------
   Every detector pushes through registerSignal(). One place decides:
     - dedupe
     - insert order
     - UI rendering
     - whether it can be clicked to navigate the chart
*/

function registerSignal(sig){
  /* sig = { kind, dir, time, tf, sym, price, title, evidence, meta } */
  if(!sig || !sig.kind || !sig.time) return;
  const key = sig.sym + "|" + sig.kind + "|" + Math.floor(sig.time / 60) + "|" + sig.dir;
  if(state.signalsSeen.has(key)) return;
  state.signalsSeen.add(key);
  if(state.signalsSeen.size > 4000){
    /* keep the set bounded */
    state.signalsSeen = new Set(Array.from(state.signalsSeen).slice(-2000));
  }
  sig.id = key;
  state.signals.unshift(sig);
  if(state.signals.length > 200) state.signals.pop();
  if(state.panel === "signals") renderSignals();
}

function rebuildSignalsFromEngines(){
  const candles = state.candles;
  if(candles.length < 60) return;
  const sym = state.sym, name = state.name, tf = state.tf;
  const lastTime = candles[candles.length-1].time;

  const bos     = detectBOS(candles);
  const choch   = detectCHoCH(candles);
  const mss     = detectMSS(candles);
  const sweeps  = detectSweeps(candles);
  const disp    = detectDisplacement(candles);
  const smcict  = buildSMCICT(candles, state.htf);

  /* BOS */
  for(const b of bos.slice(-3)){
    if(lastTime - b.time > 3600 * 12) continue;
    registerSignal({
      kind: "BOS", dir: b.dir, time: b.time, tf, sym, name,
      price: b.price,
      title: "Break of structure " + b.dir.toUpperCase(),
      evidence: b.evidence
    });
  }
  /* CHoCH */
  for(const c of choch.slice(-2)){
    if(lastTime - c.time > 3600 * 12) continue;
    registerSignal({
      kind: "CHoCH", dir: c.dir, time: c.time, tf, sym, name,
      price: c.price,
      title: "Change of character " + c.dir.toUpperCase(),
      evidence: c.evidence
    });
  }
  /* MSS */
  for(const m of mss.slice(-2)){
    if(lastTime - m.time > 3600 * 24) continue;
    registerSignal({
      kind: "MSS", dir: m.dir, time: m.time, tf, sym, name,
      price: m.price,
      title: "Market structure shift " + m.dir.toUpperCase(),
      evidence: m.evidence
    });
  }
  /* Sweeps */
  for(const s of sweeps.slice(-4)){
    registerSignal({
      kind: "LIQ SWEEP",
      dir: s.kind === "SSL" ? "up" : "down",
      time: s.time, tf, sym, name,
      price: s.price,
      title: (s.kind === "SSL" ? "Sell-side" : "Buy-side") + " liquidity swept",
      evidence: s.evidence
    });
  }
  /* Displacement */
  for(const d of disp.slice(-3)){
    registerSignal({
      kind: "DISPLACEMENT",
      dir: d.dir,
      time: d.time, tf, sym, name,
      price: d.price,
      title: "Displacement " + d.dir.toUpperCase(),
      evidence: d.evidence
    });
  }
  /* Order blocks */
  for(const ob of smcict.ob.slice(-3)){
    registerSignal({
      kind: "ORDER BLOCK",
      dir: ob.dir === "bull" ? "up" : "down",
      time: ob.time, tf, sym, name,
      price: ob.dir === "bull" ? ob.low : ob.high,
      title: (ob.dir === "bull" ? "Bullish" : "Bearish") + " order block",
      evidence: ob.evidence
    });
  }
  /* FVGs */
  for(const f of smcict.fvg.slice(-3)){
    registerSignal({
      kind: "FVG",
      dir: f.dir === "bull" ? "up" : "down",
      time: f.time, tf, sym, name,
      price: f.dir === "bull" ? f.low : f.high,
      title: (f.dir === "bull" ? "Bullish" : "Bearish") + " fair value gap",
      evidence: f.evidence
    });
  }
  /* Breakouts */
  const breaks = detectBreakouts(candles, state.htf, sweeps, disp);
  state.breakouts = breaks;
  for(const b of breaks.slice(-4)){
    registerSignal({
      kind: "BREAKOUT",
      dir: b.dir,
      time: b.time, tf, sym, name,
      price: b.price,
      title: "Breakout " + b.dir.toUpperCase() + " · " + b.label,
      evidence: b.basis.join(" · "),
      meta: { score: b.score, label: b.label }
    });
  }
  /* AMD phase change */
  if(smcict.amd){
    state.ict = { phase: smcict.amd.phase, mix: smcict.amd.mix, killzone: smcict.killzone };
    registerSignal({
      kind: "ICT PHASE",
      dir: smcict.amd.phase === "Distribution" ? "down"
           : smcict.amd.phase === "Accumulation" ? "up" : "neut",
      time: lastTime, tf, sym, name,
      price: candles[candles.length-1].close,
      title: "ICT phase · " + smcict.amd.phase,
      evidence: smcict.amd.basis.join(" · ")
    });
  }
  state.smc = { ob: smcict.ob, fvg: smcict.fvg };
  state.structure = bos;
  state.choch = choch;
  state.mss = mss;
  state.smcictCache = smcict;

  renderSignals();
  if(state.panel === "liquidity") renderLiquidity();
  if(state.panel === "smcict")    renderSMCICT();
  if(state.panel === "breakout")  renderBreakout();
  if(state.panel === "structure") renderStructurePanel();
  if(state.panel === "analyze")   renderAnalyze();
}

/* ---------- CHART ---------- */
let chart, candleSeries, ema20Series, ema50Series, ema200Series, vwapSeries;

function initChart(){
  const el = $("chart");
  chart = LightweightCharts.createChart(el, {
    layout: {
      background: { color: "#0b0e11" },
      textColor: "#9aa4b2",
      fontSize: 10
    },
    grid: {
      vertLines: { color: "#131722" },
      horzLines: { color: "#131722" }
    },
    rightPriceScale: { borderColor: "#1e2329" },
    timeScale: {
      borderColor: "#1e2329",
      timeVisible: true,
      secondsVisible: false
    },
    crosshair: { mode: 0 },
    autoSize: true
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: "#26a69a", downColor: "#ef5350",
    borderUpColor: "#26a69a", borderDownColor: "#ef5350",
    wickUpColor: "#26a69a", wickDownColor: "#ef5350"
  });
  ema20Series = chart.addLineSeries({
    color: "#2962ff", lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false
  });
  ema50Series = chart.addLineSeries({
    color: "#ff9800", lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false
  });
  ema200Series = chart.addLineSeries({
    color: "#9c27b0", lineWidth: 1,
    priceLineVisible: false, lastValueVisible: false
  });
  vwapSeries = chart.addLineSeries({
    color: "#00bcd4", lineWidth: 1, lineStyle: 3,
    priceLineVisible: false, lastValueVisible: false
  });

  chart.subscribeClick(param => {
    if(!param || param.point == null) return;
    try {
      const price = candleSeries.coordinateToPrice(param.point.y);
      if(price != null){
        const nearest = state.signals.find(s =>
          Math.abs(s.price - price) / price < 0.005);
        if(nearest) navigateToSignal(nearest);
      }
    } catch(e){}
  });
}

function renderChartFull(){
  if(!chart || !candleSeries) return;
  const c = state.candles;
  if(!c.length) return;
  candleSeries.setData(c.map(x => ({
    time: x.time, open: x.open, high: x.high, low: x.low, close: x.close
  })));
  const closes = c.map(x => x.close);
  setLine(ema20Series, ema(closes, 20), c);
  setLine(ema50Series, ema(closes, 50), c);
  setLine(ema200Series, ema(closes, 200), c);
  setLine(vwapSeries, vwap(c), c);
  try { chart.timeScale().fitContent(); } catch(e){}
}

function setLine(series, values, candles){
  if(!series) return;
  const data = [];
  for(let i=0;i<candles.length;i++){
    if(values[i] != null) data.push({ time: candles[i].time, value: values[i] });
  }
  series.setData(data);
}

/* Called by Part 1's onKlineUpdate for every tick / closed candle */
function renderChartUpdate(candle, isClosed){
  if(!candleSeries) return;
  candleSeries.update({
    time: candle.time, open: candle.open, high: candle.high,
    low: candle.low, close: candle.close
  });
  const c = state.candles;
  const closes = c.map(x => x.close);
  updateLine(ema20Series, ema(closes, 20), c);
  updateLine(ema50Series, ema(closes, 50), c);
  updateLine(ema200Series, ema(closes, 200), c);
  updateLine(vwapSeries, vwap(c), c);
}

function updateLine(series, values, candles){
  if(!series || !candles.length) return;
  const i = candles.length - 1;
  if(values[i] == null) return;
  series.update({ time: candles[i].time, value: values[i] });
}

/* ---------- CHART OVERLAYS (liquidity + signal price lines) ---------- */

function clearHighlight(){
  if(!candleSeries) return;
  for(const line of state.highlight.priceLines){
    try { candleSeries.removePriceLine(line); } catch(e){}
  }
  state.highlight.priceLines = [];
  try { candleSeries.setMarkers([]); } catch(e){}
  state.highlight.markers = [];
}

function drawLiquidityOverlay(){
  if(!candleSeries) return;
  for(const z of state.liquidityZones.slice(0, 8)){
    if(!z.hot && z.score < 55) continue;
    const color = z.type === "BSL" ? "#ef5350" : "#26a69a";
    try {
      const line = candleSeries.createPriceLine({
        price: z.price,
        color,
        lineWidth: 1,
        lineStyle: 2,
        axisLabelVisible: true,
        title: z.label
      });
      state.highlight.priceLines.push(line);
    } catch(e){}
  }
}

/* ---------- SIGNAL → CHART NAVIGATION (the fix) ---------- */

/**
 * navigateToSignal(sig):
 *   1. switch symbol if needed (fetch + stream + wait)
 *   2. switch timeframe if needed
 *   3. ensure candles cover sig.time (extend fetch if not)
 *   4. scroll chart so sig.time is visible
 *   5. set a marker at sig.time/price
 *   6. draw a price line at sig.price
 *   7. open the panel that owns this signal type
 */
async function navigateToSignal(sig){
  if(!sig) return;

  const needSymbolSwitch = sig.sym && sig.sym !== state.sym;
  const needTFSwitch     = sig.tf  && sig.tf  !== state.tf;

  if(needSymbolSwitch){
    await selectSymbol(sig.sym, sig.name || sig.sym.replace("USDT",""), sig.tf || state.tf);
  } else if(needTFSwitch){
    await switchTimeframe(sig.tf, /*keepSymbol*/ true);
  }

  /* make sure the timestamp exists in our candle array */
  if(state.candles.length &&
     state.candles[0].time > sig.time){
    await extendHistory(sig.time);
  }

  scrollToTime(sig.time);
  highlightSignalOnChart(sig);
  openPanel(panelForSignal(sig.kind));
}

function panelForSignal(kind){
  switch(kind){
    case "BOS":
    case "CHoCH":
    case "MSS":          return "structure";
    case "LIQ SWEEP":
    case "LIQ POOL":     return "liquidity";
    case "ORDER BLOCK":
    case "FVG":
    case "ICT PHASE":    return "smcict";
    case "BREAKOUT":     return "breakout";
    case "DISPLACEMENT": return "smcict";
    default:             return "signals";
  }
}

function scrollToTime(t){
  if(!chart) return;
  try {
    const ts = chart.timeScale();
    if(ts.scrollToPosition) {
      /* lightweight-charts 4.1: scrollToPosition shifts the visible window.
         We approximate by setVisibleRange around the signal time. */
      const left  = t - 60 * tfSeconds(state.tf) * 5;
      const right = t + 60 * tfSeconds(state.tf) * 2;
      ts.setVisibleRange({ from: left, to: right });
    }
  } catch(e){}
}

function highlightSignalOnChart(sig){
  clearHighlight();
  if(!candleSeries) return;

  try {
    candleSeries.setMarkers([{
      time: sig.time,
      position: sig.dir === "down" ? "aboveBar" : "belowBar",
      color: sig.dir === "down" ? "#ef5350"
             : sig.dir === "up" ? "#26a69a" : "#f0b90b",
      shape: sig.dir === "down" ? "arrowDown"
             : sig.dir === "up" ? "arrowUp" : "circle",
      text: sig.kind
    }]);
    state.highlight.markers = [sig.id];
  } catch(e){}

  try {
    const line = candleSeries.createPriceLine({
      price: sig.price,
      color: "#f0b90b",
      lineWidth: 2,
      lineStyle: 0,
      axisLabelVisible: true,
      title: sig.kind
    });
    state.highlight.priceLines.push(line);
  } catch(e){}

  showHighlightChip(sig);
}

function showHighlightChip(sig){
  const el = $("chartOverlay");
  if(!el) return;
  el.innerHTML =
    '<div class="chip warn">' + escapeHtml(sig.kind) + '</div>' +
    '<div class="chip">' + escapeHtml(sig.name || "") + " · " + escapeHtml(sig.tf || "") + '</div>' +
    '<div class="chip">' + fmt(sig.price) + '</div>' +
    '<div class="chip">' + fmtTime(sig.time) + '</div>';
  clearTimeout(showHighlightChip._t);
  showHighlightChip._t = setTimeout(() => {

/* ---------- SYMBOL / TIMEFRAME SWITCHING ---------- */

async function selectSymbol(sym, name, tf){
  state.sym  = sym;
  state.name = name;
  if(tf) state.tf = tf;

  const seq = ++state.klineSeq;

  const hSym = $("hSym");
  const hMeta = $("hMeta");
  if(hSym)  hSym.textContent = name + " / USDT";
  if(hMeta) hMeta.textContent = state.tf + " · loading…";
  setStatus("loading " + name + "…", "");

  /* Highlight active TF button */
  document.querySelectorAll(".tf").forEach(b => {
    b.classList.toggle("on", b.dataset.tf === state.tf);
  });

  /* Fetch main TF + HTFs in parallel */
  let candles, h4, d1;
  try {
    [candles, h4, d1] = await Promise.all([
      fetchKlines(sym, state.tf, 500),
      fetchKlines(sym, "4h", 200),
      fetchKlines(sym, "1d", 200)
    ]);
  } catch(e){
    setStatus("load failed — " + e.message, "err");
    return;
  }

  if(seq !== state.klineSeq) return;   /* superseded */

  state.candles = candles;
  state.htf["4h"] = h4;
  state.htf["1d"] = d1;

  if(!state.candles.length){
    setStatus("no data", "err");
    return;
  }

  renderChartFull();

  /* Restart streams */
  startKlineStream(sym, state.tf);

  /* OI + funding (async, don't block) */
  fetchOpenInterest(sym).then(v => { state.oi = v; });
  fetchFunding(sym).then(v => { state.funding = v; });

  /* Rebuild everything */
  state.signalsSeen = new Set();
  state.signals = [];
  state.liquidityZones = buildLiquidityZones(state.candles, state.htf);
  drawLiquidityOverlay();
  rebuildSignalsFromEngines();

  setStatus(name + " · " + state.tf + " · live", "live");
  if(hMeta) hMeta.textContent = state.tf + " · live";
}

async function switchTimeframe(tf, keepSymbol){
  if(tf === state.tf) return;
  state.tf = tf;
  const sym = state.sym, name = state.name;
  if(keepSymbol){
    await selectSymbol(sym, name, tf);
  } else {
    await selectSymbol(sym, name, tf);
  }
}

async function extendHistory(targetTime){
  /* Re-fetch with a higher limit if we need older candles */
  try {
    const more = await fetchKlines(state.sym, state.tf, 1000);
    if(more.length && more[0].time <= targetTime){
      state.candles = more;
      renderChartFull();
    }
  } catch(e){}
}

/* ---------- ENGINE RUNNER (throttled) ---------- */

let engineRafPending = false;
function runEngines(){
  if(engineRafPending) return;
  engineRafPending = true;
  requestAnimationFrame(() => {
    engineRafPending = false;
    try {
      state.liquidityZones = buildLiquidityZones(state.candles, state.htf);
      drawLiquidityOverlay();
      rebuildSignalsFromEngines();
    } catch(e){}
  });
}

function focusPrice(price){
  if(!chart) return;
  try {
    const c = state.candles;
    if(!c.length) return;
    const range = Math.max(...c.slice(-60).map(x => x.high)) -
                  Math.min(...c.slice(-60).map(x => x.low));
    const halfSpan = Math.max(range * 0.6, price * 0.005);
    chart.priceScale("right").applyOptions({ autoScale: false });
    chart.priceScale("right").setVisibleRange({
      from: price - halfSpan,
      to:   price + halfSpan
    });
    /* marker */
    clearHighlight();
    if(candleSeries){
      candleSeries.createPriceLine({
        price, color: "#f0b90b", lineWidth: 2, lineStyle: 0,
        axisLabelVisible: true, title: "focus"
      });
      state.highlight.priceLines.push(
        candleSeries.createPriceLine({
          price, color: "#f0b90b", lineWidth: 2, lineStyle: 0,
          axisLabelVisible: true, title: "focus"
        })
      );
    }
  } catch(e){}
}

  const closes = c.map(x => x.close);
  const r = last(rsi(closes, 14));
  const atr = last(atrSeries(c, 14));

  let algoCard = "";

      '<div class="card">' +

      '<div class="kv"><span class="k">20-bar move (ATR)</span><span class="v">' +

  if(!trimmed.startsWith("/")){
    out.innerHTML = '<div class="card"><h4>Response</h4>' +
      '<div style="font-size:12px;color:#9aa4b2;line-height:1.6">' +
        'Type <b>/help</b> for available commands. This console is ' +
        'for actions, not free-form chat.' +
      '</div></div>' + out.innerHTML;
    return;
  }
  const parts = trimmed.slice(1).split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(" ");
  const fn = COMMANDS[cmd];
  if(!fn){
    out.innerHTML = '<div class="card"><h4>Unknown command</h4>' +
      '<div style="font-size:12px;color:#9aa4b2">Try /help</div></div>' +
      out.innerHTML;
    return;
  }
  const result = fn(arg);
  out.innerHTML = '<div class="card"><h4>/' + escapeHtml(cmd) + '</h4>' +
    '<div style="font-size:12px;line-height:1.6">' + result + '</div></div>' +
    out.innerHTML;
  if(cmd !== "analyze") renderAnalyze();
}

/* ---------- UI WIRING ---------- */

function buildTimeframeBar(){
  const bar = $("tfbar");
  if(!bar) return;
  bar.innerHTML = TF_LIST.map(tf =>
    '<button class="tf' + (tf === state.tf ? " on" : "") +
    '" data-tf="' + tf + '">' + tf + '</button>').join("");
  bar.querySelectorAll(".tf").forEach(btn => {
    btn.addEventListener("click", () => switchTimeframe(btn.dataset.tf, true));
  });
}

function wireTabs(){
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => openPanel(tab.dataset.p));
  });
}

function wireComposer(){
  const form = $("composerForm");
  const input = $("cmdInput");
  if(!form || !input) return;
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    input.value = "";
    runCommand(v);
  });
}

/* ---------- BOOT ---------- */

async function boot(){
  if(state.booted) return;
  state.booted = true;

  initChart();
  buildTimeframeBar();
  wireTabs();
  wireComposer();

  /* Initial symbol */
  await selectSymbol("BTCUSDT", "BTC", "5m");

  /* Ticker stream for header price updates */
  startTickerStream();

  /* Periodic refresh: OI, funding, signals */
  setInterval(() => {
    fetchOpenInterest(state.sym).then(v => { state.oi = v; });
    fetchFunding(state.sym).then(v => { state.funding = v; });
    if(state.panel === "analyze") renderAnalyze();
  }, 30000);

  /* Periodic engine pass even when no ticks arrive */
  setInterval(() => {
    if(state.candles.length) runEngines();
  }, 15000);

  /* Resize handled by lightweight-charts autoSize */

  /* First render */
  openPanel("signals");
  renderAnalyze();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  setTimeout(boot, 0);
}

/* ---------- END ---------- */
})();
</script>
</body>
</html>
