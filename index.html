<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCity Terminal v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0e11;color:#eaecef;font:13px/1.45 -apple-system,system-ui,sans-serif;overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100vh;max-width:1500px;margin:0 auto}
#head{background:#0d1117;border-bottom:1px solid #1e2329;padding:8px 12px;flex-shrink:0}
#headTop{display:flex;justify-content:space-between;gap:10px}
#symName{font-size:15px;font-weight:700}
#symMeta{font-size:10px;color:#848e9c;margin-top:1px}
#priceMain{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
#priceChange{font-size:11px;font-weight:600;text-align:right}
#tfbar{display:flex;gap:3px;margin-top:6px;overflow-x:auto;scrollbar-width:none}
#tfbar::-webkit-scrollbar{display:none}
.tf{padding:4px 9px;font-size:10px;background:#1e2329;color:#848e9c;border:none;border-radius:4px;cursor:pointer;font-family:inherit;font-weight:600;white-space:nowrap;flex-shrink:0}
.tf.on{background:#f0b90b;color:#0b0e11}
#ticker{background:#0d1117;padding:3px 6px;font-size:10px;overflow-x:auto;border-bottom:1px solid #1e2329;flex-shrink:0;white-space:nowrap;scrollbar-width:none}
#ticker::-webkit-scrollbar{display:none}
.tk{display:inline-block;padding:3px 8px;margin-right:3px;background:#131722;border-radius:3px;color:#848e9c;cursor:pointer;font-weight:600}
.tk.on{background:#1e2329;color:#f0b90b}
.tk span{margin-left:4px}
.tk span.up{color:#26a69a}
.tk span.down{color:#ef5350}
#chartWrap{flex:1;min-height:0;background:#0b0e11;position:relative;overflow:hidden}
#mainChart{position:absolute;inset:0}
#chartOverlay{position:absolute;top:6px;left:8px;z-index:6;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(13,17,23,.92);border:1px solid #1e2329;color:#eaecef;padding:4px 9px;font-size:10px;font-weight:700;border-radius:4px}
.chip.warn{color:#f0b90b;border-color:#f0b90b}
#status{position:absolute;bottom:4px;left:8px;font-size:9px;color:#5e6673;z-index:5;background:rgba(11,14,17,.8);padding:2px 6px;border-radius:3px}
#status.live{color:#26a69a}
#status.err{color:#ef5350}
#panel{background:#0d1117;display:none;flex-direction:column;flex-shrink:0;max-height:60vh;border-top:1px solid #1e2329;overflow:hidden}
#panel.on{display:flex}
#panelHeader{padding:8px 12px;border-bottom:1px solid #1e2329;display:flex;justify-content:space-between;align-items:center}
#panelTitle{font-size:11px;color:#f0b90b;font-weight:700;letter-spacing:1px}
#panelClose{background:none;border:none;color:#848e9c;font-size:18px;cursor:pointer}
#panelContent{overflow-y:auto;padding:10px}
.pane{display:none}
.pane.on{display:block}
.card{background:#131722;border:1px solid #1e2329;border-radius:6px;padding:10px;margin-bottom:8px}
.card h4{margin:0 0 8px;font-size:10px;color:#848e9c;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.card h4.hot{color:#f0b90b}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #1a1f2b;font-size:11px;gap:8px}
.kv:last-child{border-bottom:none}
.kv .k{color:#848e9c}
.kv .v{color:#eaecef;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.kv .v.pos{color:#26a69a}
.kv .v.neg{color:#ef5350}
.kv .v.warn{color:#f0b90b}
.sigItem{display:flex;flex-direction:column;gap:3px;padding:9px 10px;margin-bottom:6px;background:#131722;border:1px solid #1e2329;border-radius:6px;cursor:pointer}
.sigItem:hover{border-color:#f0b90b}
.sigItem.bull{border-left:3px solid #26a69a}
.sigItem.bear{border-left:3px solid #ef5350}
.sigItem.neut{border-left:3px solid #f0b90b}
.sigTop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sigCoin{font-weight:700;font-size:12px}
.sigBadge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:700}
.sigBadge.bull{background:rgba(38,166,154,.18);color:#26a69a}
.sigBadge.bear{background:rgba(239,83,80,.18);color:#ef5350}
.sigBadge.neut{background:rgba(240,185,11,.15);color:#f0b90b}
.sigMeta{color:#848e9c;font-size:10px}
.sigTF{color:#f0b90b;font-size:9px;background:rgba(240,185,11,.12);padding:1px 5px;border-radius:3px;margin-right:4px;font-weight:700}
.sigReason{color:#9aa4b2;font-size:11px;line-height:1.5}
.empty{color:#848e9c;font-size:11px;text-align:center;padding:20px 10px;line-height:1.6}
.liqItem{padding:9px 10px;margin-bottom:6px;background:#131722;border:1px solid #1e2329;border-radius:6px;cursor:pointer}
.liqItem.hot{border-color:#f0b90b;background:rgba(240,185,11,.06)}
.liqTop{display:flex;justify-content:space-between;margin-bottom:4px}
.liqName{font-weight:700;font-size:12px}
.liqScore{font-size:11px;font-weight:700;color:#f0b90b}
.liqMeta{font-size:10px;color:#5e6673;margin-bottom:4px}
.liqBasis{font-size:11px;color:#9aa4b2;line-height:1.5}
.liqBar{height:4px;background:#1e2329;border-radius:2px;overflow:hidden;margin-top:6px}
.liqBar .fill{height:100%;background:linear-gradient(90deg,#f0b90b,#ef5350)}
.verdict{padding:12px;border-radius:6px;font-weight:700;font-size:15px;text-align:center;margin-bottom:8px}
.verdict.bull{background:rgba(38,166,154,.15);color:#26a69a;border:1px solid rgba(38,166,154,.4)}
.verdict.bear{background:rgba(239,83,80,.15);color:#ef5350;border:1px solid rgba(239,83,80,.4)}
.verdict.neut{background:rgba(240,185,11,.12);color:#f0b90b;border:1px solid rgba(240,185,11,.3)}
.verdict small{display:block;font-size:10px;color:#848e9c;margin-top:5px;font-weight:400}
.ev{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #1a1f2b;font-size:11px}
.ev:last-child{border-bottom:none}
.ev .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.ev .dot.g{background:#26a69a}
.ev .dot.r{background:#ef5350}
.ev .dot.y{background:#f0b90b}
.ev b{color:#eaecef;font-size:11px}
.ev span{color:#848e9c;display:block;margin-top:2px;font-size:10px}
.phaseBar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0;background:#1e2329}
.phaseBar .seg{height:100%}
.phaseBar .acc{background:#2962ff}
.phaseBar .man{background:#f0b90b}
.phaseBar .dis{background:#ef5350}
.btn{background:#1e2329;color:#eaecef;border:1px solid #2a2e39;padding:6px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;margin:0 4px 6px 0}
.btn.primary{background:#f0b90b;color:#0b0e11;border-color:#f0b90b}
.btn.danger{background:rgba(239,83,80,.15);color:#ef5350;border-color:#ef5350}
#tabBar{background:#0d1117;border-top:1px solid #1e2329;display:flex;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#tabBar::-webkit-scrollbar{display:none}
.tab{padding:9px 11px;font-size:10px;background:none;color:#848e9c;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;font-weight:700;letter-spacing:.4px;white-space:nowrap;flex-shrink:0}
.tab.on{color:#f0b90b;border-bottom-color:#f0b90b;background:#131722}
.loader{display:inline-block;width:11px;height:11px;border:2px solid #2a2e39;border-top-color:#f0b90b;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.patItem{display:flex;flex-direction:column;gap:3px;padding:10px;margin-bottom:6px;background:#131722;border:1px solid #1e2329;border-radius:6px;cursor:pointer;border-left:3px solid #f0b90b}
.patItem:hover{border-color:#f0b90b}
.patItem.w{border-left-color:#26a69a}
.patItem.m{border-left-color:#ef5350}
.patItem.hs{border-left-color:#b26bff}
.patItem.cup{border-left-color:#00bcd4}
.patTop{display:flex;justify-content:space-between;gap:8px}
.patCoin{font-weight:700;font-size:13px}
.patType{font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px;background:#1e2329;color:#f0b90b}
.patMeta{font-size:10px;color:#848e9c}
.scanBar{height:6px;background:#1e2329;border-radius:3px;overflow:hidden;margin:8px 0;display:none}
.scanBar.on{display:block}
.scanBar .fill{height:100%;background:linear-gradient(90deg,#26a69a,#f0b90b);width:0%;transition:width .2s}
.inp{width:100%;background:#0b0e11;border:1px solid #2a2e39;color:#eaecef;padding:8px 10px;border-radius:5px;font-family:inherit;font-size:11px;outline:none;margin-bottom:6px}
.alert-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #1a1f2b;font-size:11px}
.alert-item.hit{color:#26a69a}
.alert-del{color:#ef5350;cursor:pointer;margin-left:8px;font-weight:700}
.mtfGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.mtfCell{background:#131722;border:1px solid #1e2329;border-radius:5px;padding:6px 4px;text-align:center}
.mtfCell .l{font-size:9px;color:#848e9c;margin-bottom:3px}
.mtfCell .s{font-size:11px;font-weight:700}
.mtfCell.bull .s{color:#26a69a}
.mtfCell.bear .s{color:#ef5350}
.mtfCell.neut .s{color:#848e9c}
.hmGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hmCell{background:#131722;border:1px solid #1e2329;border-radius:5px;padding:8px;text-align:center;cursor:pointer}
.hmCell .s{font-size:10px;font-weight:700}
.hmCell .p{font-size:11px;margin-top:3px}
.hmCell .c{font-size:9px;font-weight:600;margin-top:2px}
@media(max-width:600px){
  #priceMain{font-size:15px}
  .tf{padding:3px 7px;font-size:9px}
  .tab{padding:8px 9px;font-size:9px}
}
</style>
</head>

<script>
"use strict";

var COINS = [
  ["BTCUSDT","BTC"],["ETHUSDT","ETH"],["BNBUSDT","BNB"],["SOLUSDT","SOL"],
  ["XRPUSDT","XRP"],["ADAUSDT","ADA"],["DOGEUSDT","DOGE"],["AVAXUSDT","AVAX"],
  ["TRXUSDT","TRX"],["DOTUSDT","DOT"],["LINKUSDT","LINK"],["TONUSDT","TON"],
  ["SHIBUSDT","SHIB"],["LTCUSDT","LTC"],["BCHUSDT","BCH"],["UNIUSDT","UNI"],
  ["ATOMUSDT","ATOM"],["XLMUSDT","XLM"],["ETCUSDT","ETC"],["NEARUSDT","NEAR"],
  ["ICPUSDT","ICP"],["FILUSDT","FIL"],["APTUSDT","APT"],["ARBUSDT","ARB"],
  ["OPUSDT","OP"],["INJUSDT","INJ"],["SUIUSDT","SUI"],["SEIUSDT","SEI"],
  ["TIAUSDT","TIA"],["PEPEUSDT","PEPE"],["WIFUSDT","WIF"],["BONKUSDT","BONK"],
  ["JUPUSDT","JUP"],["PYTHUSDT","PYTH"],["RNDRUSDT","RNDR"],["FETUSDT","FET"],
  ["IMXUSDT","IMX"],["STXUSDT","STX"],["ORDIUSDT","ORDI"],["WLDUSDT","WLD"],
  ["RUNEUSDT","RUNE"],["GALAUSDT","GALA"],["SANDUSDT","SAND"],["MANAUSDT","MANA"],
  ["AAVEUSDT","AAVE"],["MKRUSDT","MKR"],["CRVUSDT","CRV"],["LDOUSDT","LDO"],
  ["SNXUSDT","SNX"],["ENSUSDT","ENS"]
];

var TF_SECONDS = {"1m":60,"5m":300,"15m":900,"30m":1800,"1h":3600,"4h":14400,"1d":86400};
var ALL_TFS = ["1m","5m","15m","30m","1h","4h","1d"];
var SCAN_TFS = ["15m","1h","4h","1d"];
var BINANCE_REST = "https://data-api.binance.vision";
var BINANCE_WS = "wss://data-stream.binance.vision";

var TABS = [
  {id:"signals",label:"SIGNALS"},
  {id:"liquidity",label:"LIQUIDITY"},
  {id:"smcict",label:"SMC + ICT"},
  {id:"breakout",label:"BREAKOUT"},
  {id:"structure",label:"STRUCTURE"},
  {id:"scanner",label:"SCANNER"},
  {id:"orderflow",label:"ORDER FLOW"},
  {id:"mtf",label:"MULTI-TF"},
  {id:"heatmap",label:"HEATMAP"},
  {id:"alerts",label:"ALERTS"}
];

var S = {
  sym:"BTCUSDT", name:"BTC", tf:"5m",
  candles:[], htf:{},
  klineWS:null, seq:0, retry:0,
  ticker:{}, liqs:[],
  signals:[], seen:{},
  liquidity:[], structure:[], choch:[], mss:[], breakouts:[],
  smc:{ob:[],fvg:[]}, amd:null,
  algo:null, verdict:null,
  panel:"signals",
  hl:[],
  scanAbort:false,
  chart:null, candleSeries:null,
  e20:null, e50:null, e200:null, vw:null, st:null,
  booted:false
};

function $(id){ return document.getElementById(id); }
function last(a){ return a[a.length-1]; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi,v)); }

function fmt(n){
  if(!isFinite(n)||n==null) return "—";
  var a = Math.abs(n);
  if(a>=1000) return n.toLocaleString("en-US",{maximumFractionDigits:2});
  if(a>=1) return n.toFixed(2);
  if(a>=0.01) return n.toFixed(4);
  if(a>=0.0001) return n.toFixed(6);
  return n.toExponential(3);
}
function fmtPct(n){ return !isFinite(n)?"—":(n>=0?"+":"")+n.toFixed(2)+"%"; }
function fmtTime(s){ return new Date(s*1000).toLocaleString([],{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
function setStatus(m,c){ var el=$("status"); if(el){ el.textContent=m; el.className=c||""; } }
function tfSec(tf){ return TF_SECONDS[tf]||300; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* Indicators */
function ema(v,p){
  var o=new Array(v.length).fill(null);
  if(v.length<p) return o;
  var k=2/(p+1), s=0;
  for(var i=0;i<p;i++) s+=v[i];
  var prev=s/p;
  o[p-1]=prev;
  for(var j=p;j<v.length;j++){ prev=v[j]*k+prev*(1-k); o[j]=prev; }
  return o;
}
function rsi(v,p){
  p=p||14;
  var o=new Array(v.length).fill(null);
  if(v.length<=p) return o;
  var g=0,l=0,i;
  for(i=1;i<=p;i++){ var d=v[i]-v[i-1]; if(d>=0) g+=d; else l-=d; }
  var ag=g/p, al=l/p;
  o[p]=al===0?100:100-100/(1+ag/al);
  for(i=p+1;i<v.length;i++){
    var dd=v[i]-v[i-1];
    ag=(ag*(p-1)+Math.max(dd,0))/p;
    al=(al*(p-1)+Math.max(-dd,0))/p;
    o[i]=al===0?100:100-100/(1+ag/al);
  }
  return o;
}
function atr(c,p){
  p=p||14;
  var tr=c.map(function(x,i){
    if(i===0) return x.high-x.low;
    var pc=c[i-1].close;
    return Math.max(x.high-x.low, Math.abs(x.high-pc), Math.abs(x.low-pc));
  });
  var o=new Array(c.length).fill(null);
  if(c.length<p) return o;
  var s=0,i;
  for(i=0;i<p;i++) s+=tr[i];
  var prev=s/p;
  o[p-1]=prev;
  for(i=p;i<c.length;i++){ prev=(prev*(p-1)+tr[i])/p; o[i]=prev; }
  return o;
}
function vwap(c){
  var o=new Array(c.length).fill(null);
  var cumPV=0,cumV=0,dayStart=-1;
  for(var i=0;i<c.length;i++){
    var day=Math.floor(c[i].time/86400);
    if(day!==dayStart){ cumPV=0; cumV=0; dayStart=day; }
    var t=(c[i].high+c[i].low+c[i].close)/3;
    cumPV+=t*c[i].volume;
    cumV+=c[i].volume;
    o[i]=cumV?cumPV/cumV:null;
  }
  return o;
}
function supertrend(c,p,m){
  p=p||10; m=m||3;
  var a=atr(c,p);
  var dir=new Array(c.length).fill(null);
  var tr=new Array(c.length).fill(null);
  var ld=1,lu=null,ll=null;
  for(var i=0;i<c.length;i++){
    if(a[i]==null) continue;
    var mid=(c[i].high+c[i].low)/2;
    var up=mid+m*a[i], lo=mid-m*a[i];
    var fu=(lu!=null && c[i-1] && c[i-1].close<=lu)?Math.min(up,lu):up;
    var fl=(ll!=null && c[i-1] && c[i-1].close>=ll)?Math.max(lo,ll):lo;
    var d=ld;
    if(ld===1 && c[i].close<fl) d=-1;
    else if(ld===-1 && c[i].close>fu) d=1;
    dir[i]=d;
    tr[i]=d===1?fl:fu;
    lu=fu; ll=fl; ld=d;
  }
  return {dir:dir, trend:tr};
}

/* Swings */
function swings(c,s){
  s=s||3;
  var H=[],L=[];
  for(var i=s;i<c.length-s;i++){
    var isH=true,isL=true;
    for(var j=i-s;j<=i+s;j++){
      if(j===i) continue;
      if(c[j].high>=c[i].high) isH=false;
      if(c[j].low<=c[i].low) isL=false;
    }
    if(isH) H.push({i:i, price:c[i].high, time:c[i].time});
    if(isL) L.push({i:i, price:c[i].low, time:c[i].time});
  }
  return {highs:H, lows:L};
}

function detectBOS(c){
  var sw = swings(c,3);
  var merged = sw.highs.map(function(h){ return {i:h.i,price:h.price,time:h.time,kind:"H"}; })
    .concat(sw.lows.map(function(l){ return {i:l.i,price:l.price,time:l.time,kind:"L"}; }))
    .sort(function(a,b){ return a.i-b.i; });
  var out=[];
  var lh=null, ll=null, bias=null;
  for(var k=0;k<merged.length;k++){
    var p = merged[k];
    if(p.kind==="H"){
      if(lh && p.price>lh.price && bias!=="up"){
        out.push({type:"BOS", dir:"up", price:lh.price, time:p.time, i:p.i,
          evidence:"Higher high broke prior swing high "+fmt(lh.price)});
        bias="up";
      }
      lh=p;
    } else {
      if(ll && p.price<ll.price && bias!=="down"){
        out.push({type:"BOS", dir:"down", price:ll.price, time:p.time, i:p.i,
          evidence:"Lower low broke prior swing low "+fmt(ll.price)});
        bias="down";
      }
      ll=p;
    }
  }
  return out;
}

function detectCHoCH(c){
  var bos = detectBOS(c);
  var out=[], pd=null;
  for(var i=0;i<bos.length;i++){
    var e = bos[i];
    if(pd && e.dir!==pd){
      out.push({type:"CHoCH", dir:e.dir, price:e.price, time:e.time, i:e.i,
        evidence:"First "+e.dir.toUpperCase()+" break against "+pd.toUpperCase()+" bias"});
    }
    pd = e.dir;
  }
  return out;
}

function detectMSS(c){
  var ch = detectCHoCH(c);
  var out=[];
  for(var i=1;i<ch.length;i++){
    if(ch[i].dir!==ch[i-1].dir){
      out.push({type:"MSS", dir:ch[i].dir, price:ch[i].price, time:ch[i].time, i:ch[i].i,
        evidence:"Structure shifted "+ch[i-1].dir.toUpperCase()+" → "+ch[i].dir.toUpperCase()});
    }
  }
  return out;
}

function detectSweeps(c){
  var sw = swings(c,3);
  var out=[];
  var highs = sw.highs.slice(-15);
  var lows = sw.lows.slice(-15);
  highs.forEach(function(h){
    var after = c.slice(h.i+1, h.i+21);
    for(var k=0;k<after.length;k++){
      var x = after[k];
      var uw = x.high - Math.max(x.open,x.close);
      var bd = Math.abs(x.close-x.open);
      if(x.high>h.price && x.close<h.price && uw>bd*1.5){
        out.push({kind:"BSL", price:h.price, time:x.time,
          evidence:"Wick pierced swing high "+fmt(h.price)+" then closed below — BSL swept"});
        break;
      }
    }
  });
  lows.forEach(function(l){
    var after = c.slice(l.i+1, l.i+21);
    for(var k=0;k<after.length;k++){
      var x = after[k];
      var lw = Math.min(x.open,x.close)-x.low;
      var bd = Math.abs(x.close-x.open);
      if(x.low<l.price && x.close>l.price && lw>bd*1.5){
        out.push({kind:"SSL", price:l.price, time:x.time,
          evidence:"Wick pierced swing low "+fmt(l.price)+" then closed above — SSL swept"});
        break;
      }
    }
  });
  return out.sort(function(a,b){ return a.time-b.time; }).slice(-12);
}

function detectDisplacement(c){
  var a = atr(c,14);
  var out=[];
  for(var i=15;i<c.length;i++){
    if(a[i]==null) continue;
    var x = c[i];
    var bd = Math.abs(x.close-x.open);
    var rng = (x.high-x.low)||1e-9;
    var r = bd/Math.max(a[i],1e-9);
    if(r>1.6 && bd/rng>0.7){
      out.push({time:x.time, dir:x.close>x.open?"up":"down", magnitude:r, price:x.close,
        evidence:"Body "+r.toFixed(2)+"× ATR(14), closed near extreme"});
    }
  }
  return out.slice(-10);
}

function equalLevels(arr, tol){
  tol = tol||0.002;
  var groups=[], used={};
  for(var i=0;i<arr.length;i++){
    if(used[i]) continue;
    var a = arr[i];
    var g = {price:a.price, touches:1, lastTime:a.time};
    for(var j=i+1;j<arr.length;j++){
      if(used[j]) continue;
      var b = arr[j];
      if(Math.abs(b.price-a.price)/a.price<tol){
        g.price = (g.price*g.touches + b.price)/(g.touches+1);
        g.touches++;
        g.lastTime = b.time;
        used[j]=true;
      }
    }
    if(g.touches>=2) groups.push(g);
    used[i]=true;
  }
  return groups;
}

function buildLiquidity(c, htf){
  if(c.length<40) return [];
  var sw = swings(c,5);
  var zones=[];
  var price = c[c.length-1].close;

  function score(touches, lastTime, price){
    var s = 0;
    var basis = [];
    if(touches>=5){ s+=40; basis.push(touches+" touches (major)"); }
    else if(touches>=3){ s+=25; basis.push(touches+" touches"); }
    else { s+=10; basis.push(touches+" touch"); }
    var barsAgo = 9999;
    for(var i=c.length-1;i>=0;i--){ if(c[i].time<=lastTime){ barsAgo=c.length-1-i; break; } }
    if(barsAgo<30){ s+=15; basis.push("recent interaction"); }
    else if(barsAgo<100){ s+=8; basis.push("moderate recency"); }
    var in4 = htf["4h"] && htf["4h"].some(function(x){ return price>=x.low && price<=x.high; });
    var in1 = htf["1d"] && htf["1d"].some(function(x){ return price>=x.low && price<=x.high; });
    if(in4){ s+=15; basis.push("4H structure"); }
    if(in1){ s+=20; basis.push("1D structure"); }
    var dist = Math.abs(price - c[c.length-1].close)/c[c.length-1].close*100;
    if(dist<3){ s+=5; basis.push("near price"); }
    return {score:clamp(s,0,100), basis:basis};
  }

  equalLevels(sw.highs, 0.002).forEach(function(g){
    var r = score(g.touches, g.lastTime, g.price);
    zones.push({type:"BSL", label:"Equal highs", price:g.price, touches:g.touches,
      score:r.score, basis:r.basis, hot:r.score>=65});
  });
  equalLevels(sw.lows, 0.002).forEach(function(g){
    var r = score(g.touches, g.lastTime, g.price);
    zones.push({type:"SSL", label:"Equal lows", price:g.price, touches:g.touches,
      score:r.score, basis:r.basis, hot:r.score>=65});
  });
  sw.highs.slice(-6).forEach(function(h){
    var r = score(1, h.time, h.price);
    if(r.score>=40) zones.push({type:"BSL", label:"Swing high", price:h.price, touches:1,
      score:r.score, basis:r.basis, hot:r.score>=65});
  });
  sw.lows.slice(-6).forEach(function(l){
    var r = score(1, l.time, l.price);
    if(r.score>=40) zones.push({type:"SSL", label:"Swing low", price:l.price, touches:1,
      score:r.score, basis:r.basis, hot:r.score>=65});
  });

  var d1 = htf["1d"];
  if(d1 && d1.length>=2){
    var p = d1[d1.length-2];
    var r1 = score(2, c[c.length-1].time, p.high);
    zones.push({type:"BSL", label:"Previous day high", price:p.high, touches:2,
      score:r1.score, basis:r1.basis, hot:r1.score>=65});
    var r2 = score(2, c[c.length-1].time, p.low);
    zones.push({type:"SSL", label:"Previous day low", price:p.low, touches:2,
      score:r2.score, basis:r2.basis, hot:r2.score>=65});
  }

  zones.sort(function(a,b){ return b.score-a.score; });
  var kept=[];
  zones.forEach(function(z){
    if(kept.some(function(k){ return Math.abs(k.price-z.price)/z.price<0.002; })) return;
    kept.push(z);
  });
  return kept.slice(0,20);
}

function detectAMD(htf){
  var d4 = htf["4h"];
  if(!d4 || d4.length<30) return null;
  var recent = d4.slice(-12), prior = d4.slice(-30,-12);
  if(!recent.length || !prior.length) return null;
  var rR = Math.max.apply(null, recent.map(function(x){ return x.high; })) - Math.min.apply(null, recent.map(function(x){ return x.low; }));
  var rP = Math.max.apply(null, prior.map(function(x){ return x.high; })) - Math.min.apply(null, prior.map(function(x){ return x.low; }));
  var rangeRatio = rP?rR/rP:1;
  var vR = recent.reduce(function(a,x){ return a+x.volume; },0)/recent.length;
  var vP = prior.reduce(function(a,x){ return a+x.volume; },0)/prior.length;
  var volRatio = vP?vR/vP:1;
  var pH = Math.max.apply(null, prior.map(function(x){ return x.high; }));
  var pL = Math.min.apply(null, prior.map(function(x){ return x.low; }));
  var lc = d4[d4.length-1].close;
  var swH=false, swL=false;
  recent.forEach(function(x){
    if(x.high>pH && x.close<pH) swH=true;
    if(x.low<pL && x.close>pL) swL=true;
  });
  var e20 = ema(d4.map(function(x){ return x.close; }),20);
  var e50 = ema(d4.map(function(x){ return x.close; }),50);
  var up = e20[e20.length-1]!=null && e50[e50.length-1]!=null && e20[e20.length-1]>e50[e50.length-1];
  var acc=0, man=0, dis=0;
  if(rangeRatio<0.7) acc+=40; else if(rangeRatio<0.9) acc+=20;
  if(volRatio<0.8) acc+=30; else if(volRatio<1) acc+=15;
  if(lc>pL && lc<pH) acc+=20;
  if(swH||swL) man+=50;
  if(volRatio>1.4) man+=25;
  if(rangeRatio>1.1) man+=15;
  if(rangeRatio>1.3) dis+=35;
  dis+=20;
  if(volRatio>1.2) dis+=20;
  if(Math.abs(lc-pH)/pH<0.02 || Math.abs(lc-pL)/pL<0.02) dis+=15;
  var tot = acc+man+dis||1;
  var mix = {acc:Math.round(acc/tot*100), man:Math.round(man/tot*100), dis:Math.round(dis/tot*100)};
  var phase = "Unclear";
  if(mix.acc>=mix.man && mix.acc>=mix.dis) phase="Accumulation";
  else if(mix.man>=mix.dis) phase="Manipulation";
  else phase="Distribution";
  var basis = [
    "Range "+rangeRatio.toFixed(2)+"× prior 30-bar range",
    "Volume "+volRatio.toFixed(2)+"× prior 30-bar avg",
    "4H EMA20 "+(up?"above":"below")+" EMA50"
  ];
  if(swH) basis.push("Swept prior 4H swing high");
  if(swL) basis.push("Swept prior 4H swing low");
  return {phase:phase, mix:mix, basis:basis};
}

function detectOB(c, bos){
  var out=[];
  bos.slice(-8).forEach(function(b){
    for(var i=b.i;i>=Math.max(0,b.i-12);i--){
      var x = c[i];
      var opp = b.dir==="up" ? x.close<x.open : x.close>x.open;
      if(opp){
        out.push({dir:b.dir==="up"?"bull":"bear", high:x.high, low:x.low, time:x.time,
          evidence:(b.dir==="up"?"Last down candle":"Last up candle")+" before BOS — "+fmt(x.low)+" → "+fmt(x.high)});
        break;
      }
    }
  });
  return out.slice(-6);
}

function detectFVG(c){
  var out=[];
  for(var i=2;i<c.length;i++){
    var a = c[i-2], x = c[i];
    if(a.high<x.low) out.push({dir:"bull", low:a.high, high:x.low, time:x.time,
      evidence:"Bullish FVG "+fmt(a.high)+" → "+fmt(x.low)});
    if(a.low>x.high) out.push({dir:"bear", low:x.high, high:a.low, time:x.time,
      evidence:"Bearish FVG "+fmt(x.high)+" → "+fmt(a.low)});
  }
  return out.slice(-10);
}

function scoreBreakout(b, c, htf, sweeps, disp){
  var basis=[], score=0;
  var vHere = c[b.i].volume;
  var vStart = Math.max(0, b.i-20);
  var vAvg = 0;
  for(var k=vStart;k<b.i;k++) vAvg += c[k].volume;
  vAvg = vAvg/Math.max(1, b.i-vStart);
  var vR = vAvg?vHere/vAvg:1;
  if(vR>2){ score+=25; basis.push("volume "+vR.toFixed(2)+"× avg"); }
  else if(vR>1.3){ score+=15; basis.push("volume "+vR.toFixed(2)+"× avg"); }
  else { score-=10; basis.push("thin volume"); }

  var nearDisp = disp.find(function(d){
    var idx = c.findIndex(function(x){ return x.time===d.time; });
    return idx>=0 && Math.abs(idx-b.i)<=3;
  });
  if(nearDisp && nearDisp.dir===b.dir){ score+=20; basis.push("displacement confirms"); }

  var swBefore = sweeps.find(function(s){
    if(s.kind !== (b.dir==="up"?"SSL":"BSL")) return false;
    if(s.time > b.time) return false;
    var idx = c.findIndex(function(x){ return x.time===s.time; });
    return idx>=0 && idx>=b.i-15;
  });
  if(swBefore){ score-=15; basis.push("sweep before break (trap risk)"); }

  var d4 = htf["4h"];
  if(d4 && d4.length>=20){
    var e20 = ema(d4.map(function(x){ return x.close; }),20);
    var htfDir = e20[e20.length-1]!=null && d4[d4.length-1].close>e20[e20.length-1] ? "up" : "down";
    if(htfDir===b.dir){ score+=20; basis.push("4H trend aligned"); }
    else { score-=10; basis.push("against 4H trend"); }
  }

  var e20c = ema(c.map(function(x){ return x.close; }),20);
  if(e20c[b.i]!=null && e20c[Math.max(0,b.i-5)]!=null){
    var sl = e20c[b.i]-e20c[Math.max(0,b.i-5)];
    if((b.dir==="up"&&sl>0)||(b.dir==="down"&&sl<0)){ score+=15; basis.push("EMA20 slope supports"); }
    else { score-=5; basis.push("EMA20 slope opposing"); }
  }

  score = clamp(score,0,100);
  var label = score>=70?"GENUINE":score>=45?"SUSPECT":"FAKE";
  return {score:score, label:label, basis:basis};
}

function detectBreakouts(c, htf, sweeps, disp){
  var bos = detectBOS(c);
  return bos.slice(-8).map(function(b){
    var r = scoreBreakout(b, c, htf, sweeps, disp);
    return {type:"BREAKOUT", dir:b.dir, price:b.price, time:b.time, i:b.i,
      score:r.score, label:r.label, basis:r.basis, evidence:b.evidence};
  });
}

/* Trendlines */
function detectTrendlines(c){
  var sw = swings(c,5);
  var out=[];
  if(sw.lows.length>=3){
    var l1 = sw.lows[sw.lows.length-3];
    var l2 = sw.lows[sw.lows.length-2];
    if(l2.price>l1.price && l2.i>l1.i){
      var slope = (l2.price-l1.price)/(l2.i-l1.i);
      var projected = l2.price + slope*(c.length-1-l2.i);
      var cur = c[c.length-1], prev = c[c.length-2];
      var isBreak = cur.close<projected && prev.close>=projected;
      var near = Math.abs(cur.close-projected)/projected<0.008;
      out.push({type:"Uptrend line", dir:"up", slope:slope, projected:projected,
        isBreak:isBreak, near:near, anchorPrice:l2.price, anchorIndex:l2.i});
    }
  }
  if(sw.highs.length>=3){
    var h1 = sw.highs[sw.highs.length-3];
    var h2 = sw.highs[sw.highs.length-2];
    if(h2.price<h1.price && h2.i>h1.i){
      var slope2 = (h2.price-h1.price)/(h2.i-h1.i);
      var projected2 = h2.price + slope2*(c.length-1-h2.i);
      var cur2 = c[c.length-1], prev2 = c[c.length-2];
      var isBreak2 = cur2.close>projected2 && prev2.close<=projected2;
      var near2 = Math.abs(cur2.close-projected2)/projected2<0.008;
      out.push({type:"Downtrend line", dir:"down", slope:slope2, projected:projected2,
        isBreak:isBreak2, near:near2, anchorPrice:h2.price, anchorIndex:h2.i});
    }
  }
  return out;
}

function detectTrendlineRetest(c){
  var out=[];
  var sw = swings(c,5);
  var curPrice = c[c.length-1].close;
  if(sw.lows.length>=3){
    var l1 = sw.lows[sw.lows.length-3], l2 = sw.lows[sw.lows.length-2];
    if(l2.price>l1.price){
      var slope = (l2.price-l1.price)/(l2.i-l1.i);
      for(var i=l2.i+3;i<c.length-3;i++){
        var lineAt = l2.price + slope*(i-l2.i);
        if(c[i].close<lineAt*0.995){
          for(var j=i+2;j<c.length;j++){
            var lineNow = l2.price + slope*(j-l2.i);
            if(Math.abs(c[j].close-lineNow)/lineNow<0.006){
              if(c.length-1-j<40){
                out.push({type:"Uptrend retest", dir:"down",
                  role: curPrice<lineNow?"acting as resistance":"reclaimed as support",
                  linePrice:lineNow, retestedAt:c[j].time});
              }
              break;
            }
          }
          break;
        }
      }
    }
  }
  if(sw.highs.length>=3){
    var h1 = sw.highs[sw.highs.length-3], h2 = sw.highs[sw.highs.length-2];
    if(h2.price<h1.price){
      var slope2 = (h2.price-h1.price)/(h2.i-h1.i);
      for(var i2=h2.i+3;i2<c.length-3;i2++){
        var lineAt2 = h2.price + slope2*(i2-h2.i);
        if(c[i2].close>lineAt2*1.005){
          for(var j2=i2+2;j2<c.length;j2++){
            var lineNow2 = h2.price + slope2*(j2-h2.i);
            if(Math.abs(c[j2].close-lineNow2)/lineNow2<0.006){
              if(c.length-1-j2<40){
                out.push({type:"Downtrend retest", dir:"up",
                  role: curPrice>lineNow2?"acting as support":"rejected as resistance",
                  linePrice:lineNow2, retestedAt:c[j2].time});
              }
              break;
            }
          }
          break;
        }
      }
    }
  }
  return out;
}

/* Pattern detectors */
function detectW(c){
  var sw = swings(c,5);
  if(sw.lows.length<2) return null;
  for(var i=sw.lows.length-1;i>=1;i--){
    var l2 = sw.lows[i], l1 = sw.lows[i-1];
    if(Math.abs(l2.price-l1.price)/l1.price>0.02) continue;
    if(l2.i-l1.i<5) continue;
    var peak=0;
    for(var j=l1.i+1;j<l2.i;j++) if(c[j].high>peak) peak=c[j].high;
    if((peak-l1.price)/l1.price<0.02) continue;
    if(c.length-1-l2.i>120) continue;
    var px = c[c.length-1].close;
    var breakout = px>peak;
    var forming = px>l1.price && px<peak;
    if(!breakout && !forming) continue;
    return {pattern:"W", dir:"up", neckline:peak, breakout:breakout, forming:forming, formedAt:c[l2.i].time};
  }
  return null;
}
function detectM(c){
  var sw = swings(c,5);
  if(sw.highs.length<2) return null;
  for(var i=sw.highs.length-1;i>=1;i--){
    var h2 = sw.highs[i], h1 = sw.highs[i-1];
    if(Math.abs(h2.price-h1.price)/h1.price>0.02) continue;
    if(h2.i-h1.i<5) continue;
    var valley=Infinity;
    for(var j=h1.i+1;j<h2.i;j++) if(c[j].low<valley) valley=c[j].low;
    if((h1.price-valley)/h1.price<0.02) continue;
    if(c.length-1-h2.i>120) continue;
    var px = c[c.length-1].close;
    var breakout = px<valley;
    var forming = px<h1.price && px>valley;
    if(!breakout && !forming) continue;
    return {pattern:"M", dir:"down", neckline:valley, breakout:breakout, forming:forming, formedAt:c[h2.i].time};
  }
  return null;
}
function detectHS(c){
  var sw = swings(c,5);
  if(sw.highs.length<3) return null;
  for(var i=sw.highs.length-1;i>=2;i--){
    var r = sw.highs[i], h = sw.highs[i-1], l = sw.highs[i-2];
    if(h.price<=l.price || h.price<=r.price) continue;
    if(Math.abs(l.price-r.price)/l.price>0.05) continue;
    if((h.price-Math.max(l.price,r.price))/h.price<0.02) continue;
    var neck = (l.price+r.price)/2;
    var px = c[c.length-1].close;
    var breakout = px<neck;
    var forming = px<h.price && px>neck;
    if(!breakout && !forming) continue;
    if(c.length-1-r.i>150) continue;
    return {pattern:"H&S", dir:"down", neckline:neck, breakout:breakout, forming:forming, formedAt:c[r.i].time};
  }
  return null;
}
function detectIHS(c){
  var sw = swings(c,5);
  if(sw.lows.length<3) return null;
  for(var i=sw.lows.length-1;i>=2;i--){
    var r = sw.lows[i], h = sw.lows[i-1], l = sw.lows[i-2];
    if(h.price>=l.price || h.price>=r.price) continue;
    if(Math.abs(l.price-r.price)/l.price>0.05) continue;
    if((Math.min(l.price,r.price)-h.price)/h.price<0.02) continue;
    var neck = (l.price+r.price)/2;
    var px = c[c.length-1].close;
    var breakout = px>neck;
    var forming = px>h.price && px<neck;
    if(!breakout && !forming) continue;
    if(c.length-1-r.i>150) continue;
    return {pattern:"Inv H&S", dir:"up", neckline:neck, breakout:breakout, forming:forming, formedAt:c[r.i].time};
  }
  return null;
}
function detectCup(c){
  if(c.length<60) return null;
  var slice = c.slice(-60);
  var closes = slice.map(function(x){ return x.close; });
  var minIdx=0, minPrice=Infinity;
  for(var i=5;i<slice.length-10;i++){
    if(closes[i]<minPrice){ minPrice=closes[i]; minIdx=i; }
  }
  var cupLeft = closes[0];
  var cupRight = closes[slice.length-10];
  var cupRim = Math.max(cupLeft, cupRight);
  var cupDepth = (cupRim-minPrice)/cupRim;
  if(cupDepth<0.05) return null;
  if(minIdx<8 || minIdx>slice.length-12) return null;
  var handleLow = Infinity;
  for(var j=slice.length-10;j<slice.length-1;j++) if(closes[j]<handleLow) handleLow=closes[j];
  var handleDepth = (cupRight-handleLow)/cupRight;
  if(handleDepth>cupDepth*0.5) return null;
  var px = c[c.length-1].close;
  var breakout = px>cupRim*1.005;
  var forming = px>handleLow && px<cupRim;
  if(!breakout && !forming) return null;
  return {pattern:"Cup&Handle", dir:"up", neckline:cupRim, breakout:breakout, forming:forming, formedAt:c[c.length-1].time};
}
function detectTriangle(c){
  if(c.length<30) return null;
  var slice = c.slice(-30);
  var h=[], l=[];
  for(var i=3;i<slice.length-3;i++){
    var isH=true, isL=true;
    for(var j=i-3;j<=i+3;j++){
      if(slice[j].high>slice[i].high) isH=false;
      if(slice[j].low<slice[i].low) isL=false;
    }
    if(isH) h.push({i:i, price:slice[i].high});
    if(isL) l.push({i:i, price:slice[i].low});
  }
  if(h.length<2 || l.length<2) return null;
  var hS = (h[h.length-1].price-h[0].price)/(h[h.length-1].i-h[0].i);
  var lS = (l[l.length-1].price-l[0].price)/(l[l.length-1].i-l[0].i);
  var totalRange = Math.max.apply(null, slice.map(function(x){ return x.high; })) - Math.min.apply(null, slice.map(function(x){ return x.low; }));
  var rangeTop = h[h.length-1].price - h[0].price;
  var rangeBot = l[l.length-1].price - l[0].price;
  var flatTop = Math.abs(rangeTop)/totalRange<0.15;
  var flatBot = Math.abs(rangeBot)/totalRange<0.15;
  var rising = lS>0.0001;
  var falling = hS<-0.0001;
  var px = c[c.length-1].close;
  var top = h[h.length-1].price;
  var bot = l[l.length-1].price;
  if(flatTop && rising){
    return {pattern:"Asc Tri", dir:"up", neckline:top, breakout:px>top, forming:px<=top, formedAt:c[c.length-1].time};
  }
  if(flatBot && falling){
    return {pattern:"Desc Tri", dir:"down", neckline:bot, breakout:px<bot, forming:px>=bot, formedAt:c[c.length-1].time};
  }
  if(rising && falling){
    return {pattern:"Sym Tri", dir:"neut", neckline:(top+bot)/2, breakout:false, forming:true, formedAt:c[c.length-1].time};
  }
  return null;
}
function detectFlag(c){
  if(c.length<30) return null;
  var pole = c.slice(-30,-15);
  var flag = c.slice(-15);
  var poleChange = (pole[pole.length-1].close-pole[0].close)/pole[0].close;
  var flagChange = (flag[flag.length-1].close-flag[0].close)/flag[0].close;
  var flagRange = Math.max.apply(null, flag.map(function(x){ return x.high; })) - Math.min.apply(null, flag.map(function(x){ return x.low; }));
  var poleRange = Math.abs(pole[pole.length-1].close-pole[0].close);
  if(poleRange===0) return null;
  if(flagRange/poleRange>0.6) return null;
  if(poleChange>0.03 && Math.abs(flagChange)<0.02){
    return {pattern:"Bull Flag", dir:"up", neckline:Math.max.apply(null, flag.map(function(x){ return x.high; })),
      breakout:false, forming:true, formedAt:c[c.length-1].time};
  }
  if(poleChange<-0.03 && Math.abs(flagChange)<0.02){
    return {pattern:"Bear Flag", dir:"down", neckline:Math.min.apply(null, flag.map(function(x){ return x.low; })),
      breakout:false, forming:true, formedAt:c[c.length-1].time};
  }
  return null;
}
function detectWedge(c){
  if(c.length<30) return null;
  var slice = c.slice(-30);
  var h=[], l=[];
  for(var i=3;i<slice.length-3;i++){
    var isH=true, isL=true;
    for(var j=i-3;j<=i+3;j++){
      if(slice[j].high>slice[i].high) isH=false;
      if(slice[j].low<slice[i].low) isL=false;
    }
    if(isH) h.push({i:i, price:slice[i].high});
    if(isL) l.push({i:i, price:slice[i].low});
  }
  if(h.length<2 || l.length<2) return null;
  var hS = (h[h.length-1].price-h[0].price)/(h[h.length-1].i-h[0].i);
  var lS = (l[l.length-1].price-l[0].price)/(l[l.length-1].i-l[0].i);
  if(Math.abs(hS)<0.0001 || Math.abs(lS)<0.0001) return null;
  if(hS>0 && lS>0 && hS<lS){
    return {pattern:"Rising Wedge", dir:"down", neckline:l[l.length-1].price, breakout:false, forming:true, formedAt:c[c.length-1].time};
  }
  if(hS<0 && lS<0 && hS>lS){
    return {pattern:"Falling Wedge", dir:"up", neckline:h[h.length-1].price, breakout:false, forming:true, formedAt:c[c.length-1].time};
  }
  return null;
}

/* Algorithm model */
function detectAlgorithm(c, htf, liq, smc){
  if(c.length<40) return null;
  var vN = c.slice(-5).reduce(function(a,x){ return a+x.volume; },0)/5;
  var vP = c.slice(-30,-5).reduce(function(a,x){ return a+x.volume; },0)/25;
  var vR = vP?vN/vP:1;
  var rN = Math.max.apply(null, c.slice(-10).map(function(x){ return x.high; })) - Math.min.apply(null, c.slice(-10).map(function(x){ return x.low; }));
  var rP = Math.max.apply(null, c.slice(-40,-10).map(function(x){ return x.high; })) - Math.min.apply(null, c.slice(-40,-10).map(function(x){ return x.low; }));
  var rR = rP?rN/rP:1;
  var e20 = ema(c.map(function(x){ return x.close; }),20);
  var e50 = ema(c.map(function(x){ return x.close; }),50);
  var up = e20[e20.length-1] > e50[e50.length-1];
  var htfUp = null;
  var d4 = htf["4h"];
  if(d4 && d4.length>=25){
    var h20 = ema(d4.map(function(x){ return x.close; }),20);
    var h50 = ema(d4.map(function(x){ return x.close; }),50);
    htfUp = h20[h20.length-1]>h50[h50.length-1] ? "up":"down";
  }
  var hotLiq = liq.filter(function(z){ return z.hot; }).length;
  var scores={}, reasons={};
  function add(m, w, why){
    scores[m] = (scores[m]||0)+w;
    if(!reasons[m]) reasons[m]=[];
    reasons[m].push(why);
  }
  if(htfUp && ((htfUp==="up")===up) && rR>0.9) add("Trend continuation",30,"HTF and local trend aligned");
  if(rR<0.7 && vR<0.9){
    add("Range mean-reversion",25,"Compressed range, declining volume");
    add("Accumulation",20,"Contraction with dry volume");
  }
  if(smc.amd){
    if(smc.amd.phase==="Manipulation") add("Liquidity hunt",30,"4H AMD: manipulation");
    if(smc.amd.phase==="Accumulation") add("Accumulation",35,"4H AMD: accumulation");
    if(smc.amd.phase==="Distribution") add("Distribution",35,"4H AMD: distribution");
  }
  if(rR>1.4 && vR>1.3) add("Volatility expansion",35,"Range and volume expanding");
  if(hotLiq>=3) add("Liquidity hunt",20,hotLiq+" hot zones");
  var ranked = Object.keys(scores).map(function(m){ return {model:m, score:scores[m], reasons:reasons[m]}; })
    .sort(function(a,b){ return b.score-a.score; });
  if(!ranked.length) return null;
  var tot = ranked.reduce(function(a,b){ return a+b.score; },0);
  var top = ranked[0];
  return {model:top.model, confidence:Math.round(top.score/tot*100), reasons:top.reasons};
}

/* AI verdict */
function buildVerdict(){
  var c = S.candles;
  if(c.length<40) return null;
  var closes = c.map(function(x){ return x.close; });
  var px = closes[closes.length-1];
  var e20 = last(ema(closes,20));
  var e50 = last(ema(closes,50));
  var e200 = last(ema(closes,200));
  var r = last(rsi(closes,14));
  var st = supertrend(c,10,3);
  var stDir = st.dir[st.dir.length-1];
  var bull=0, bear=0, reasons=[];
  if(e20>e50){ bull++; reasons.push({c:"g",t:"Trend",d:"EMA20 above EMA50"}); }
  else { bear++; reasons.push({c:"r",t:"Trend",d:"EMA20 below EMA50"}); }
  if(e200!=null){
    if(px>e200){ bull++; reasons.push({c:"g",t:"Long-term",d:"Price above EMA200"}); }
    else { bear++; reasons.push({c:"r",t:"Long-term",d:"Price below EMA200"}); }
  }
  if(r>55){ bull++; reasons.push({c:"g",t:"RSI "+r.toFixed(1),d:"Above midline"}); }
  else if(r<45){ bear++; reasons.push({c:"r",t:"RSI "+r.toFixed(1),d:"Below midline"}); }
  else reasons.push({c:"y",t:"RSI "+r.toFixed(1),d:"Neutral"});
  if(stDir===1){ bull++; reasons.push({c:"g",t:"Supertrend",d:"Bullish"}); }
  else if(stDir===-1){ bear++; reasons.push({c:"r",t:"Supertrend",d:"Bearish"}); }
  if(S.amd){
    if(S.amd.phase==="Accumulation"){ bull++; reasons.push({c:"g",t:"ICT phase",d:"Accumulation"}); }
    else if(S.amd.phase==="Distribution"){ bear++; reasons.push({c:"r",t:"ICT phase",d:"Distribution"}); }
    else reasons.push({c:"y",t:"ICT phase",d:"Manipulation"});
  }
  var hotSSL = S.liquidity.filter(function(z){ return z.hot && z.type==="SSL"; }).length;
  var hotBSL = S.liquidity.filter(function(z){ return z.hot && z.type==="BSL"; }).length;
  if(hotSSL){ bull++; reasons.push({c:"g",t:"Liquidity",d:hotSSL+" hot SSL zone"}); }
  if(hotBSL){ bear++; reasons.push({c:"r",t:"Liquidity",d:hotBSL+" hot BSL zone"}); }
  var tot = bull+bear;
  var conf = Math.round(Math.abs((tot?bull/tot:0.5)-0.5)*200);
  var dir = bull>bear?"BULLISH":bear>bull?"BEARISH":"NEUTRAL";
  var cls = bull>bear?"bull":bear>bull?"bear":"neut";
  return {direction:dir, confidence:conf, bull:bull, bear:bear, reasons:reasons, cls:cls};
}

/* Data fetch */
function fetchKlines(sym, tf, limit){
  var url = BINANCE_REST + "/api/v3/klines?symbol=" + sym + "&interval=" + tf + "&limit=" + (limit||500);
  return fetch(url).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(raw){
    return raw.map(function(k){
      return {time:Math.floor(k[0]/1000), open:+k[1], high:+k[2], low:+k[3], close:+k[4], volume:+k[5]};
    });
  });
}

/* Signal registry */
function registerSignal(sig){
  if(!sig || !sig.kind || !sig.time) return;
  var key = sig.sym + "|" + sig.kind + "|" + Math.floor(sig.time/60) + "|" + sig.dir;
  if(S.seen[key]) return;
  S.seen[key] = true;
  sig.id = key;
  S.signals.unshift(sig);
  if(S.signals.length > 200) S.signals.pop();
}

function rebuild(){
  var c = S.candles;
  if(c.length<60) return;
  var sym = S.sym, name = S.name, tf = S.tf;
  var lastTime = c[c.length-1].time;

  S.liquidity = buildLiquidity(c, S.htf);
  S.structure = detectBOS(c);
  S.choch = detectCHoCH(c);
  S.mss = detectMSS(c);
  S.amd = detectAMD(S.htf);
  S.smc.ob = detectOB(c, S.structure);
  S.smc.fvg = detectFVG(c);
  var sweeps = detectSweeps(c);
  var disp = detectDisplacement(c);
  S.breakouts = detectBreakouts(c, S.htf, sweeps, disp);

  S.structure.slice(-3).forEach(function(b){
    if(lastTime-b.time > 172800) return;
    registerSignal({kind:"BOS", dir:b.dir, time:b.time, tf:tf, sym:sym, name:name, price:b.price,
      title:"Break of structure "+b.dir.toUpperCase(), evidence:b.evidence});
  });
  S.choch.slice(-2).forEach(function(ch){
    if(lastTime-ch.time > 172800) return;
    registerSignal({kind:"CHoCH", dir:ch.dir, time:ch.time, tf:tf, sym:sym, name:name, price:ch.price,
      title:"Change of character "+ch.dir.toUpperCase(), evidence:ch.evidence});
  });
  S.mss.slice(-2).forEach(function(m){
    if(lastTime-m.time > 259200) return;
    registerSignal({kind:"MSS", dir:m.dir, time:m.time, tf:tf, sym:sym, name:name, price:m.price,
      title:"Market structure shift "+m.dir.toUpperCase(), evidence:m.evidence});
  });
  sweeps.slice(-4).forEach(function(sw){
    registerSignal({kind:"LIQ SWEEP", dir:sw.kind==="SSL"?"up":"down", time:sw.time, tf:tf, sym:sym, name:name, price:sw.price,
      title:(sw.kind==="SSL"?"Sell-side":"Buy-side")+" liquidity swept", evidence:sw.evidence});
  });
  disp.slice(-3).forEach(function(d){
    registerSignal({kind:"DISPLACEMENT", dir:d.dir, time:d.time, tf:tf, sym:sym, name:name, price:d.price,
      title:"Displacement "+d.dir.toUpperCase(), evidence:d.evidence});
  });
  S.smc.ob.slice(-3).forEach(function(o){
    registerSignal({kind:"ORDER BLOCK", dir:o.dir==="bull"?"up":"down", time:o.time, tf:tf, sym:sym, name:name,
      price:o.dir==="bull"?o.low:o.high,
      title:(o.dir==="bull"?"Bullish":"Bearish")+" order block", evidence:o.evidence});
  });
  S.smc.fvg.slice(-3).forEach(function(f){
    registerSignal({kind:"FVG", dir:f.dir==="bull"?"up":"down", time:f.time, tf:tf, sym:sym, name:name,
      price:f.dir==="bull"?f.low:f.high,
      title:(f.dir==="bull"?"Bullish":"Bearish")+" FVG", evidence:f.evidence});
  });
  S.breakouts.slice(-4).forEach(function(b){
    registerSignal({kind:"BREAKOUT", dir:b.dir, time:b.time, tf:tf, sym:sym, name:name, price:b.price,
      title:"Breakout "+b.dir.toUpperCase()+" · "+b.label,
      evidence:b.basis.join(" · ")});
  });
  detectTrendlines(c).forEach(function(tl){
    if(!tl.isBreak) return;
    registerSignal({kind:"TREND BREAK", dir:tl.dir==="up"?"down":"up", time:lastTime, tf:tf, sym:sym, name:name, price:tl.projected,
      title:tl.type+" broken", evidence:tl.type+" broke at "+fmt(tl.projected)});
  });
  detectTrendlineRetest(c).forEach(function(r){
    registerSignal({kind:"RETEST", dir:r.dir, time:r.retestedAt, tf:tf, sym:sym, name:name, price:r.linePrice,
      title:r.type, evidence:r.type+" — "+r.role+" @ "+fmt(r.linePrice)});
  });
  if(S.amd){
    registerSignal({kind:"ICT PHASE",
      dir: S.amd.phase==="Distribution"?"down":S.amd.phase==="Accumulation"?"up":"neut",
      time:lastTime, tf:tf, sym:sym, name:name, price:c[c.length-1].close,
      title:"ICT phase · "+S.amd.phase, evidence:S.amd.basis.join(" · ")});
  }

  S.algo = detectAlgorithm(c, S.htf, S.liquidity, {amd:S.amd, sweeps:sweeps});
  S.verdict = buildVerdict();
}

/* Chart */
function initChart(){
  var el = $("mainChart");
  S.chart = LightweightCharts.createChart(el, {
    layout:{background:{color:"#0b0e11"}, textColor:"#d1d4dc", fontSize:10},
    grid:{vertLines:{color:"#131722"}, horzLines:{color:"#131722"}},
    rightPriceScale:{borderColor:"#1e2329"},
    timeScale:{borderColor:"#1e2329", timeVisible:true, secondsVisible:false},
    autoSize:true
  });
  S.candleSeries = S.chart.addCandlestickSeries({
    upColor:"#26a69a", downColor:"#ef5350",
    borderUpColor:"#26a69a", borderDownColor:"#ef5350",
    wickUpColor:"#26a69a", wickDownColor:"#ef5350"
  });
  S.e20 = S.chart.addLineSeries({color:"#2962ff", lineWidth:1, priceLineVisible:false, lastValueVisible:false});
  S.e50 = S.chart.addLineSeries({color:"#ff9800", lineWidth:1, priceLineVisible:false, lastValueVisible:false});
  S.e200 = S.chart.addLineSeries({color:"#9c27b0", lineWidth:1, priceLineVisible:false, lastValueVisible:false});
  S.vw = S.chart.addLineSeries({color:"#00bcd4", lineWidth:1, lineStyle:3, priceLineVisible:false, lastValueVisible:false});
  S.st = S.chart.addLineSeries({color:"#f0b90b", lineWidth:2, priceLineVisible:false, lastValueVisible:false});
}

function drawChart(){
  if(!S.candleSeries) return;
  var c = S.candles;
  if(!c.length) return;
  S.candleSeries.setData(c.map(function(x){ return {time:x.time,open:x.open,high:x.high,low:x.low,close:x.close}; }));
  var closes = c.map(function(x){ return x.close; });
  setLine(S.e20, ema(closes,20), c);
  setLine(S.e50, ema(closes,50), c);
  setLine(S.e200, ema(closes,200), c);
  setLine(S.vw, vwap(c), c);
  var st = supertrend(c,10,3);
  setLine(S.st, st.trend, c);
  try { S.chart.timeScale().fitContent(); } catch(e){}
}

function setLine(series, values, c){
  if(!series) return;
  var data = [];
  for(var i=0;i<c.length;i++){
    if(values[i]!=null) data.push({time:c[i].time, value:values[i]});
  }
  series.setData(data);
}

function updateChart(candle){
  if(!S.candleSeries) return;
  S.candleSeries.update({time:candle.time, open:candle.open, high:candle.high, low:candle.low, close:candle.close});
  var c = S.candles;
  var closes = c.map(function(x){ return x.close; });
  updLine(S.e20, ema(closes,20), c);
  updLine(S.e50, ema(closes,50), c);
  updLine(S.e200, ema(closes,200), c);
  updLine(S.vw, vwap(c), c);
}

function updLine(series, values, c){
  if(!series || !c.length) return;
  var i = c.length-1;
  if(values[i]==null) return;
  series.update({time:c[i].time, value:values[i]});
}

/* Highlight / navigation */
function clearHL(){
  if(!S.candleSeries) return;
  S.hl.forEach(function(l){ try { S.candleSeries.removePriceLine(l); } catch(e){} });
  S.hl = [];
  try { S.candleSeries.setMarkers([]); } catch(e){}
}

function highlight(sig){
  clearHL();
  if(!S.candleSeries) return;
  try {
    S.candleSeries.setMarkers([{
      time: sig.time,
      position: sig.dir==="down" ? "aboveBar" : "belowBar",
      color: sig.dir==="down" ? "#ef5350" : sig.dir==="up" ? "#26a69a" : "#f0b90b",
      shape: sig.dir==="down" ? "arrowDown" : sig.dir==="up" ? "arrowUp" : "circle",
      text: sig.kind || "SIGNAL"
    }]);
  } catch(e){}
  try {
    var line = S.candleSeries.createPriceLine({
      price: sig.price, color:"#f0b90b", lineWidth:2, lineStyle:0,
      axisLabelVisible:true, title:sig.kind || "SIG"
    });
    S.hl.push(line);
  } catch(e){}
  var el = $("chartOverlay");
  if(el){
    el.innerHTML = '<div class="chip warn">'+esc(sig.kind||"FOCUS")+'</div>'+
      '<div class="chip">'+esc(sig.name||S.name)+' · '+esc(sig.tf||S.tf)+'</div>'+
      '<div class="chip">'+fmt(sig.price)+'</div>';
    setTimeout(function(){ if(el) el.innerHTML=""; }, 12000);
  }
}

function scrollTo(t){
  if(!S.chart) return;
  try {
    var step = tfSec(S.tf);
    S.chart.timeScale().setVisibleRange({from:t-step*40, to:t+step*15});
  } catch(e){}
}

function navigateTo(sig){
  if(!sig) return Promise.resolve();
  var p;
  if(sig.sym && sig.sym !== S.sym){
    p = selectSymbol(sig.sym, sig.name || sig.sym.replace("USDT",""), sig.tf || S.tf);
  } else if(sig.tf && sig.tf !== S.tf){
    p = selectSymbol(S.sym, S.name, sig.tf);
  } else {
    p = Promise.resolve();
  }
  return p.then(function(){
    return new Promise(function(r){ setTimeout(r, 150); });
  }).then(function(){
    scrollTo(sig.time);
    highlight(sig);
    openPanel(panelFor(sig.kind));
  });
}

function panelFor(kind){
  switch(kind){
    case "BOS": case "CHoCH": case "MSS": return "structure";
    case "LIQ SWEEP": return "liquidity";
    case "ORDER BLOCK": case "FVG": case "ICT PHASE": case "DISPLACEMENT": return "smcict";
    case "BREAKOUT": return "breakout";
    case "TREND BREAK": case "RETEST": return "scanner";
    default: return "signals";
  }
}

/* Streams */
function startKline(sym, tf){
  if(S.klineWS){ try { S.klineWS.close(); } catch(e){} S.klineWS = null; }
  S.retry = 0;
  var url = BINANCE_WS + "/ws/" + sym.toLowerCase() + "@kline_" + tf;
  var ws = new WebSocket(url);
  S.klineWS = ws;
  ws.onopen = function(){ S.retry = 0; setStatus(S.name+" · "+tf+" · live", "live"); };
  ws.onmessage = function(e){
    try {
      var msg = JSON.parse(e.data);
      if(!msg.k) return;
      var k = msg.k;
      onCandle({
        time: Math.floor(k.t/1000),
        open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v
      }, k.x);
    } catch(err){}
  };
  ws.onclose = function(){
    if(S.klineWS !== ws) return;
    var delay = Math.min(30000, 1000*Math.pow(2, S.retry++));
    setStatus("reconnecting in "+Math.round(delay/1000)+"s…","err");
    setTimeout(function(){
      if(S.klineWS !== ws) return;
      startKline(S.sym, S.tf);
    }, delay);
  };
}

function onCandle(candle, closed){
  var arr = S.candles;
  if(!arr.length) arr.push(candle);
  else if(arr[arr.length-1].time === candle.time) arr[arr.length-1] = candle;
  else if(candle.time > arr[arr.length-1].time){
    arr.push(candle);
    if(arr.length > 1000) arr.shift();
  } else return;
  S.ticker[S.sym] = S.ticker[S.sym] || {};
  S.ticker[S.sym].price = candle.close;
  var pm = $("priceMain"); if(pm) pm.textContent = fmt(candle.close);
  updateChart(candle);
  if(closed) scheduleEngine();
}

function startTicker(){
  var streams = COINS.map(function(x){ return x[0].toLowerCase()+"@miniTicker"; }).join("/");
  var ws = new WebSocket(BINANCE_WS + "/stream?streams=" + streams);
  ws.onmessage = function(e){
    try {
      var msg = JSON.parse(e.data);
      var d = msg.data;
      if(!d || !d.s) return;
      var price = parseFloat(d.c);
      var open = parseFloat(d.o);
      var pct = open===0 ? 0 : ((price-open)/open)*100;
      S.ticker[d.s] = {price:price, pct:pct};
      var tkEl = document.querySelector('[data-tk="'+d.s+'"]');
      if(tkEl){
        var sp = tkEl.querySelector("span");
        if(sp){ sp.textContent = fmt(price); sp.className = pct>=0?"up":"down"; }
      }
      if(d.s === S.sym){
        var pm = $("priceMain"); if(pm) pm.textContent = fmt(price);
        var pc = $("priceChange");
        if(pc){ pc.textContent = fmtPct(pct); pc.className = pct>=0?"up":"down"; }
      }
      checkAlerts();
    } catch(err){}
  };
  ws.onclose = function(){ setTimeout(startTicker, 5000); };
}

function startLiq(){
  var ws = new WebSocket("wss://fstream.binance.com/ws/!forceOrder@arr");
  ws.onmessage = function(e){
    try {
      var arr = JSON.parse(e.data);
      var items = Array.isArray(arr) ? arr : [arr];
      items.forEach(function(m){
        var o = m.o || m;
        if(!o) return;
        var q = parseFloat(o.q);
        var pr = parseFloat(o.ap) || parseFloat(o.p);
        S.liqs.push({time:Date.now(), sym:o.s, side:o.S, price:pr, usd:q*pr});
      });
      if(S.liqs.length > 500) S.liqs = S.liqs.slice(-500);
    } catch(err){}
  };
  ws.onclose = function(){ setTimeout(startLiq, 8000); };
}

async function scanAll(){
  var out = $("patternsOut");
  var bar = $("patScanBar");
  var fill = $("patScanFill");
  out.dataset.scanned = "1";
  S.scanAbort = false;
  bar.classList.add("on");
  fill.style.width = "0%";
  out.innerHTML = '<div style="padding:10px;color:#848e9c"><span class="loader"></span>Scanning…</div>';
  var results = [];
  var total = COINS.length * SCAN_TFS.length;
  var done = 0;
  for(var ti=0;ti<SCAN_TFS.length;ti++){
    var tf = SCAN_TFS[ti];
    for(var ci=0;ci<COINS.length;ci++){
      if(S.scanAbort){ bar.classList.remove("on"); setStatus("scan stopped",""); return; }
      var pair = COINS[ci];
      try {
        var k = await fetchKlines(pair[0], tf, 200);
        if(k.length >= 40){
          var dets = [
            {fn:detectW, type:"W", cls:"w"},
            {fn:detectM, type:"M", cls:"m"},
            {fn:detectHS, type:"H&S", cls:"hs"},
            {fn:detectIHS, type:"Inv H&S", cls:"hs"},
            {fn:detectCup, type:"Cup&Handle", cls:"cup"},
            {fn:detectTriangle, type:"Triangle", cls:"tl"},
            {fn:detectFlag, type:"Flag", cls:"tl"},
            {fn:detectWedge, type:"Wedge", cls:"tl"}
          ];
          for(var di=0;di<dets.length;di++){
            try {
              var r = dets[di].fn(k);
              if(r) results.push({sym:pair[0], name:pair[1], tf:tf, pattern:r.pattern||dets[di].type, cls:dets[di].cls, data:r});
            } catch(e){}
          }
          try {
            detectTrendlines(k).forEach(function(tl){
              if(tl.isBreak) results.push({sym:pair[0], name:pair[1], tf:tf, pattern:"TL-BREAK", cls:"tl",
                data:{neckline:tl.projected, dir:tl.dir==="up"?"down":"up", note:tl.type+" broken"}});
              else if(tl.near) results.push({sym:pair[0], name:pair[1], tf:tf, pattern:"TL-NEAR", cls:"tl",
                data:{neckline:tl.projected, dir:tl.dir, note:"Approaching "+tl.type}});
            });
          } catch(e){}
          try {
            detectTrendlineRetest(k).forEach(function(r){
              results.push({sym:pair[0], name:pair[1], tf:tf, pattern:"RETEST", cls:"tl",
                data:{neckline:r.linePrice, dir:r.dir, note:r.type+" — "+r.role, formedAt:r.retestedAt}});
            });
          } catch(e){}
        }
      } catch(e){}
      done++;
      fill.style.width = ((done/total)*100).toFixed(1)+"%";
      if(done % 25 === 0){
        out.innerHTML = '<div style="padding:10px;color:#848e9c"><span class="loader"></span>'+done+'/'+total+' · '+results.length+' found</div>';
      }
      await new Promise(function(r){ setTimeout(r, 120); });
    }
    if(S.scanAbort) break;
  }
  bar.classList.remove("on");
  fill.style.width = "0%";
  setStatus("scan complete · "+results.length+" hits","");
  if(!results.length){
    out.innerHTML = '<div class="empty">No patterns found across '+total+' scans</div>';
    return;
  }
  var order = ["W","M","H&S","Inv H&S","Cup&Handle","Triangle","Flag","Wedge","TL-BREAK","TL-NEAR","RETEST"];
  var groups = {};
  results.forEach(function(r){
    if(!groups[r.pattern]) groups[r.pattern] = [];
    groups[r.pattern].push(r);
  });
  var html = '<div class="card"><h4 class="hot">'+results.length+' patterns found</h4></div>';
  order.forEach(function(type){
    var list = groups[type];
    if(!list || !list.length) return;
    html += '<div style="color:#f0b90b;font-weight:700;font-size:11px;padding:10px 0 4px">◆ '+esc(type)+' ('+list.length+')</div>';
    html += list.slice(0,40).map(function(r){
      var cls = r.cls || "tl";
      var note = r.data.note || ("Neckline "+fmt(r.data.neckline||0));
      var t = r.data.formedAt || Math.floor(Date.now()/1000);
      return '<div class="patItem '+cls+'" data-scan-sym="'+esc(r.sym)+'" data-scan-name="'+esc(r.name)+'" data-scan-tf="'+esc(r.tf)+'" data-scan-time="'+t+'" data-scan-price="'+(r.data.neckline||0)+'" data-scan-kind="'+esc(r.pattern)+'" data-scan-dir="'+(r.data.dir||"neut")+'">'+
        '<div class="patTop"><span class="patCoin">'+esc(r.name)+'</span>'+
        '<span class="patType">'+esc(r.pattern)+'</span></div>'+
        '<div class="patMeta"><span class="sigTF">'+esc(r.tf)+'</span> '+esc(note)+'</div></div>';
    }).join("");
  });
  out.innerHTML = html;
  out.querySelectorAll("[data-scan-sym]").forEach(function(el){
    el.addEventListener("click", function(){
      navigateTo({
        kind:"SCAN "+el.dataset.scanKind,
        dir: el.dataset.scanDir,
        time: parseInt(el.dataset.scanTime,10),
        tf: el.dataset.scanTf,
        sym: el.dataset.scanSym,
        name: el.dataset.scanName,
        price: parseFloat(el.dataset.scanPrice) || 0,
        id: "scan-"+el.dataset.scanSym+"-"+el.dataset.scanTime
      });
    });
  });
}

function renderOrderflow(){
  var out = $("orderflowOut");
  if(!out) return;
  var c = S.candles;
  if(c.length<10){ out.innerHTML = '<div class="empty">Loading…</div>'; return; }
  var slice = c.slice(-20);
  var buy=0, sell=0;
  slice.forEach(function(x){
    var rng = (x.high-x.low)||1e-9;
    var bR = (x.close-x.low)/rng;
    buy += x.volume*bR;
    sell += x.volume*(1-bR);
  });
  var tot = buy+sell||1;
  var pct = buy/tot*100;
  out.innerHTML = '<div class="card"><h4>Buy / Sell Pressure (20 bars)</h4>'+
    '<div style="height:8px;background:#1e2329;border-radius:4px;overflow:hidden;margin:6px 0;display:flex">'+
    '<div style="background:#26a69a;width:'+pct.toFixed(1)+'%"></div>'+
    '<div style="background:#ef5350;width:'+(100-pct).toFixed(1)+'%"></div></div>'+
    '<div class="kv"><span class="k">Buyers</span><span class="v pos">'+pct.toFixed(1)+'%</span></div>'+
    '<div class="kv"><span class="k">Sellers</span><span class="v neg">'+(100-pct).toFixed(1)+'%</span></div></div>';
}

  if(!isFinite(v)) return;
  var d = S.ticker[S.sym];
  var px = d ? d.price : (S.candles.length ? S.candles[S.candles.length-1].close : 0);
  S.alerts.push({symbol:S.sym, price:v, dir:v>px?"above":"below", hit:false});
  inp.value = "";
  renderAlerts();
}

function checkAlerts(){
  var d = S.ticker[S.sym];
  if(!d) return;
  var changed = false;
  S.alerts.forEach(function(a){
    if(a.symbol !== S.sym || a.hit) return;
    if((a.dir==="above" && d.price>=a.price) || (a.dir==="below" && d.price<=a.price)){
      a.hit = true;
      changed = true;
    }
  });
  if(changed) renderAlerts();
}

/* Symbol / TF switching */
async function selectSymbol(sym, name, tf){
  S.sym = sym; S.name = name;
  if(tf) S.tf = tf;
  var seq = ++S.seq;
  $("symName").textContent = name + " / USDT";
  $("symMeta").textContent = S.tf + " · loading…";
  setStatus("loading "+name+"…","");
  document.querySelectorAll(".tk").forEach(function(el){ el.classList.toggle("on", el.dataset.tk===sym); });
  document.querySelectorAll(".tf").forEach(function(el){ el.classList.toggle("on", el.dataset.tf===S.tf); });
  var result;
  try {
    result = await Promise.all([
      fetchKlines(sym, S.tf, 500),
      fetchKlines(sym, "4h", 200),
      fetchKlines(sym, "1d", 200)
    ]);
  } catch(e){
    setStatus("load failed — "+e.message,"err");
    return;
  }
  if(seq !== S.seq) return;
  S.candles = result[0];
  S.htf["4h"] = result[1];
  S.htf["1d"] = result[2];
  if(!S.candles.length){ setStatus("no data","err"); return; }
  drawChart();
  if(S.klineWS){ try { S.klineWS.close(); } catch(e){} S.klineWS = null; }
  startKline(sym, S.tf);
  S.seen = {};
  S.signals = [];
  try { rebuild(); renderActive(); } catch(e){ console.error(e); }
  setStatus(name+" · "+S.tf+" · live","live");
  $("symMeta").textContent = S.tf + " · live";
}

function switchTF(tf){
  if(tf === S.tf) return;
  document.querySelectorAll(".tf").forEach(function(el){ el.classList.toggle("on", el.dataset.tf===tf); });
  return selectSymbol(S.sym, S.name, tf);
}

/* Boot */
async function boot(){
  if(S.booted) return;
  S.booted = true;
  try {
    initChart();
    buildTFs();
    buildTabs();
    buildTicker();
    startTicker();
    startLiq();
    $("panelClose").addEventListener("click", function(){
      $("panel").classList.remove("on");
      document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("on"); });
    });
    $("scanBtn").addEventListener("click", scanAll);
    $("scanStopBtn").addEventListener("click", function(){ S.scanAbort = true; setStatus("scan stopped",""); });
    $("addAlertBtn").addEventListener("click", addAlert);
    await selectSymbol("BTCUSDT", "BTC", "5m");
    setInterval(function(){ if(S.candles.length) scheduleEngine(); }, 20000);
    setInterval(function(){ if(S.panel==="heatmap") renderHeatmap(); }, 3000);
    openPanel("signals");
  } catch(e){
    console.error("Boot failed:", e);
    setStatus("boot error — see console","err");
  }
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
} else {
  setTimeout(boot, 0);
}
</script>
